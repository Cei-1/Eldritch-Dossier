<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eldritch Dossier</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Terminal de Investigación de Criaturas Mitológicas" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eldritch Dossier" />

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />

    <meta http-equiv="Expires" content="0" />

    <!-- Tailwind CSS para el diseño -->

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                400: 'rgb(var(--c-e400) / <alpha-value>)',
                500: 'rgb(var(--c-e500) / <alpha-value>)',
                600: 'rgb(var(--c-e600) / <alpha-value>)',
                700: 'rgb(var(--c-e700) / <alpha-value>)',
                800: 'rgb(var(--c-e800) / <alpha-value>)',
                900: 'rgb(var(--c-e900) / <alpha-value>)',

    <style>
      /* === CSS Custom Properties === */
      :root {
        --c-e400: 52 211 153;
        --c-e500: 16 185 129;
        --c-e600: 5 150 105;
        --c-e700: 4 120 87;
        --c-e800: 6 95 70;
        --c-e900: 6 78 59;
        --c-e950: 2 44 34;
        --scanline-speed: 10s;
        --scanline-opacity: 0.1;
        --crt-line-size: 4px;
      }



      @keyframes flicker {
        0% { opacity: 0.05; }
        50% { opacity: 0.02; }
        100% { opacity: 0.05; }
      }
      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      body {
        background-color: black;
        margin: 0;
        overflow-x: hidden;
        color: rgb(var(--c-e500));
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: rgb(var(--c-e900)); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-e500)); }

      .crt-overlay {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
          linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        background-size: 100% var(--crt-line-size), 3px 100%;
        transition: all 0.8s;
      }


      .scanline {
        width: 100%;
        height: 100px;
        z-index: 201;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.02) 10%, rgba(0, 0, 0, 0.1) 100%);
        opacity: var(--scanline-opacity);
        position: absolute;
        bottom: 100%;
        animation: scanline var(--scanline-speed) linear infinite;
        transition: opacity 0.8s;
      }


      #root { min-height: 100vh; }
      option { background: #000; color: rgb(var(--c-e500)); }
      input, textarea, select { border-radius: 0 !important; }

      .chip-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid rgb(var(--c-e900));
        background: rgb(var(--c-e900) / 0.15);
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: 0.05em;
        color: rgb(var(--c-e500));
        cursor: default;
        transition: all 0.2s;
      }
      .chip-tag:hover {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }
      .chip-tag .chip-remove {
        cursor: pointer;
        color: rgb(var(--c-e900));
        font-size: 14px;
        line-height: 1;
        transition: color 0.2s;
      }
      .chip-tag:hover .chip-remove {
        color: #ef4444;
      }

      /* === DECLASSIFICATION ANIMATIONS === */
      @keyframes scanReveal {
        0% { clip-path: inset(0 0 100% 0); filter: brightness(3) saturate(0); }
        30% { filter: brightness(2) saturate(0.3); }
        100% { clip-path: inset(0 0 0% 0); filter: brightness(1) saturate(1); }
      }
      @keyframes fieldReveal {
        0% { opacity: 0; transform: translateY(12px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      @keyframes stampSlam {
        0% { transform: translate(-50%, -50%) scale(5) rotate(-25deg); opacity: 0; }
        40% { transform: translate(-50%, -50%) scale(0.9) rotate(-12deg); opacity: 1; }
        55% { transform: translate(-50%, -50%) scale(1.08) rotate(-12deg); }
        100% { transform: translate(-50%, -50%) scale(1) rotate(-12deg); opacity: 0.55; }
      }
      @keyframes accessGlow {
        0%, 100% { box-shadow: 0 0 20px rgb(var(--c-e900) / 0.3); border-color: rgb(var(--c-e900)); }
        50% { box-shadow: 0 0 50px rgb(var(--c-e500) / 0.2); border-color: rgb(var(--c-e500)); }
      }
      @keyframes accessGlowDanger {
        0%, 100% { box-shadow: 0 0 20px rgba(220,38,38,0.3); border-color: #7f1d1d; }
        50% { box-shadow: 0 0 60px rgba(220,38,38,0.4); border-color: #dc2626; }
      }
      @keyframes accessLine {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      @keyframes dangerPulse {
        0%, 100% { box-shadow: 0 0 0 rgba(220,38,38,0); border-color: rgba(220,38,38,0.3); }
        50% { box-shadow: 0 0 15px rgba(220,38,38,0.3); border-color: rgba(220,38,38,0.7); }
      }
      @keyframes absoluteGlitch {
        0%, 14% { clip-path: inset(0 0 0 0); transform: translate(0); }
        15% { clip-path: inset(40% 0 30% 0); transform: translate(-3px, 1px); }
        16% { clip-path: inset(10% 0 60% 0); transform: translate(3px, -1px); }
        17%, 41% { clip-path: inset(0 0 0 0); transform: translate(0); }
        42% { clip-path: inset(50% 0 20% 0); transform: translate(2px, 0); }
        43% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 1px); }
        44%, 79% { clip-path: inset(0 0 0 0); transform: translate(0); }
        80% { clip-path: inset(60% 0 10% 0); transform: translate(-4px, 0); }
        81%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      }
      @keyframes absoluteFlicker {
        0%, 91% { opacity: 1; }
        92% { opacity: 0.3; }
        93% { opacity: 1; }
        95% { opacity: 0.5; }
        96%, 100% { opacity: 1; }
      }
      @keyframes voidGlow {
        0%, 100% { box-shadow: 0 0 8px rgba(139,92,246,0.2), 0 0 2px rgba(6,182,212,0.1); border-color: rgba(139,92,246,0.4); }
        33% { box-shadow: 0 0 25px rgba(139,92,246,0.5), 0 0 8px rgba(6,182,212,0.3); border-color: rgba(6,182,212,0.7); }
        66% { box-shadow: 0 0 15px rgba(6,182,212,0.4), 0 0 30px rgba(139,92,246,0.3); border-color: rgba(139,92,246,0.8); }
      }
      @keyframes chromaShift {
        0%, 14%, 17%, 41%, 44%, 100% { text-shadow: none; }
        15% { text-shadow: -2px 0 #06b6d4, 2px 0 #a855f7; }
        16% { text-shadow: 2px 0 #06b6d4, -2px 0 #a855f7; }
        42% { text-shadow: -1px 0 #06b6d4, 1px 0 #a855f7; }
        43% { text-shadow: 1px 0 #06b6d4, -1px 0 #a855f7; }
      }
      @keyframes voidShake {
        0%, 95% { transform: translate(0); }
        96% { transform: translate(-2px, 1px); }
        97% { transform: translate(2px, -1px); }
        98% { transform: translate(-1px, -1px); }
        99% { transform: translate(1px, 1px); }
        100% { transform: translate(0); }
      }
      @keyframes infoGlitch {
        0%, 89% { transform: translate(0); opacity: 1; }
        90% { transform: translate(-1px, 0); opacity: 0.8; }
        91% { transform: translate(1px, 1px); opacity: 1; }
        92%, 100% { transform: translate(0); opacity: 1; }
      }
      @keyframes termType {
        from { width: 0; }
        to { width: 100%; }
      }
      .card-danger-extreme {
        animation: dangerPulse 3s ease-in-out infinite;
      }
      .card-danger-absolute {
        animation: voidGlow 3s ease-in-out infinite, absoluteFlicker 5s step-end infinite;
        position: relative;
      }
      .card-danger-absolute .card-img-wrap {
        animation: absoluteGlitch 4s step-end infinite;
      }
      .card-danger-absolute .card-name-absoluto {
        animation: chromaShift 4s step-end infinite;
        color: #a855f7 !important;
      }
      .card-danger-absolute::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139,92,246,0.03) 2px,
          rgba(139,92,246,0.03) 4px
        );
        pointer-events: none;
        z-index: 10;
      }
      .modal-absoluto-glitch {
        animation: infoGlitch 6s step-end infinite;
      }
      .modal-absoluto-glitch h2 {
        animation: chromaShift 4s step-end infinite;
      }
      .modal-absoluto-img {
        animation: absoluteGlitch 5s step-end infinite;
      }
      .modal-absoluto-shake {
        animation: voidShake 3s ease-in-out infinite;
      }
      .declass-scan { animation: scanReveal 1.4s ease-out both; }
      .declass-field { opacity: 0; animation: fieldReveal 0.5s ease-out both; }
      .declass-stamp { animation: stampSlam 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
      .declass-access { animation: accessGlow 1.2s ease-in-out infinite; }
      .declass-access-danger { animation: accessGlowDanger 1s ease-in-out infinite; }
      .declass-access-void {
        animation: voidGlow 2s ease-in-out infinite;
      }
      .declass-progress { animation: accessLine 1.6s ease-in-out both; }
      .declass-stamp-fade { opacity: 0; transition: opacity 0.8s ease-out; }
    </style>
  </head>
  <body>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback, useRef } = React;

      // --- SCRAMBLE TEXT HOOK ---
      function useScrambleText(finalText, active = true, duration = 1500) {
        const [display, setDisplay] = useState('');
        const chars = '!@#$%^&*_+-=|;:<>?/~0123456789ABCDEF';
        useEffect(() => {
          if (!active || !finalText) { setDisplay(finalText || ''); return; }
          let frame = 0;
          const totalFrames = Math.max(1, duration / 30);
          const interval = setInterval(() => {
            frame++;
            const progress = frame / totalFrames;
            let result = '';
            for (let i = 0; i < finalText.length; i++) {
              if (finalText[i] === ' ') { result += ' '; }
              else if (i / finalText.length < progress) { result += finalText[i]; }
              else { result += chars[Math.floor(Math.random() * chars.length)]; }
            }
            setDisplay(result);
            if (frame >= totalFrames) { clearInterval(interval); setDisplay(finalText); }
          }, 30);
          return () => clearInterval(interval);
        }, [finalText, active]);
        return display;
      }

      // --- DECLASSIFY ACCESS OVERLAY ---
      const DeclassifyOverlay = ({ creatureId, dangerLevel, onComplete }) => {
        const isDanger = ['Extremo','Absoluto'].includes(dangerLevel);
        const isAbsoluto = dangerLevel === 'Absoluto';
        const line1Text = isAbsoluto ? 'CONTENCIÓN_FALLIDA' : isDanger ? 'ALERTA_ACCESO_RESTRINGIDO' : 'ACCEDIENDO_ARCHIVO_CLASIFICADO';
        const line3Text = isAbsoluto ? 'INTEGRIDAD_SISTEMA_COMPROMETIDA...' : isDanger ? 'VERIFICANDO_NIVEL_AUTORIZACIÓN...' : 'VERIFICANDO_ACREDITACIÓN...';
        const accessLabel = isAbsoluto
          ? 'ANOMALÍA_NIVEL_ABSOLUTO // PELIGRO_EXISTENCIAL'
          : isDanger ? `AMENAZA_${dangerLevel?.toUpperCase().replace(' ','_')} // PROTOCOLO_ROJO` : 'CIFRADO_ELDRITCH_CEI // NIVEL_ACCESO_4';
        const line1 = useScrambleText(line1Text, true, 800);
        const line2 = useScrambleText(creatureId || 'ED-000000-000', true, 1000);
        const line3 = useScrambleText(line3Text, true, 1200);
        const line4Warn = useScrambleText(isAbsoluto ? '[ ADVERTENCIA: LECTURA_PUEDE_CAUSAR_DAÑO_COGNITIVO ]' : '', isAbsoluto, 1500);

        useEffect(() => {
          const timer = setTimeout(() => onComplete(), isAbsoluto ? 2800 : isDanger ? 2200 : 1800);
          return () => clearTimeout(timer);
        }, []);

        const borderCls = isAbsoluto ? 'border-purple-700 declass-access-void' : isDanger ? 'declass-access-danger border-red-900' : 'declass-access border-emerald-900';
        const textCls = isAbsoluto ? 'text-purple-400' : isDanger ? 'text-red-500' : 'text-emerald-500';
        const subCls = isAbsoluto ? 'text-purple-800' : isDanger ? 'text-red-800' : 'text-emerald-800';
        const barBg = isAbsoluto ? 'bg-purple-950' : isDanger ? 'bg-red-950' : 'bg-emerald-950';
        const barFg = isAbsoluto ? 'bg-purple-500' : isDanger ? 'bg-red-500' : 'bg-emerald-500';
        const labelCls = isAbsoluto ? 'text-purple-950' : isDanger ? 'text-red-950' : 'text-emerald-950';
        const headerCls = isAbsoluto ? 'text-purple-600' : isDanger ? 'text-red-700' : 'text-emerald-900';

        return (
          <div className={`absolute inset-0 z-50 bg-black flex flex-col items-center justify-center gap-4 ${isAbsoluto ? 'modal-absoluto-shake' : ''}`}>
            <div className={`text-[10px] font-black uppercase tracking-[0.5em] animate-pulse ${headerCls}`}>
              {isAbsoluto ? '[ ⚠️ BRECHA_DE_CONTENCIÓN ]' : '[ PROTOCOLO_DE_ACCESO ]'}
            </div>
            <div className={`border-2 p-8 max-w-md w-full mx-4 ${borderCls}`}>
              <div className={`text-xs font-black uppercase tracking-[0.3em] mb-2 ${textCls}`}>{line1}</div>
              <div className={`text-lg font-black uppercase tracking-[0.2em] mb-3 ${isAbsoluto ? 'text-purple-300' : 'text-white'}`}>{line2}</div>
              <div className={`text-[10px] font-black uppercase tracking-[0.2em] mb-4 ${subCls}`}>{line3}</div>
              <div className={`w-full h-1 overflow-hidden ${barBg}`}>
                <div className={`h-full declass-progress ${barFg}`}></div>
              </div>
              <div className={`text-[8px] font-black uppercase mt-2 tracking-[0.4em] ${labelCls}`}>
                {accessLabel}
              </div>
              {isAbsoluto && (
                <div className="text-[8px] text-purple-500 font-black uppercase mt-4 tracking-[0.2em] animate-pulse text-center">
                  {line4Warn}
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- ICONOS SVG ---
      const Icon = ({ name, className = "w-4 h-4" }) => {
        const icons = {
          search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
          plus: <path d="M12 4v16m8-8H4" />,
          database: <path d="M4 7v10c0 1.1.9 2 2 2h12a2 2 0 002-2V7M4 7c0 1.1.9 2 2 2h12a2 2 0 002-2M4 7c0-1.1.9-2 2-2h12a2 2 0 012 2m-16 5c0 1.1.9 2 2 2h12a2 2 0 002-2m-16 5c0 1.1.9 2 2 2h12a2 2 0 002-2" />,
          save: <path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />,
          trash: <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
          edit: <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
          refresh: <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
          x: <path d="M6 18L18 6M6 6l12 12" />,
          left: <path d="M15 19l-7-7 7-7" />,
          right: <path d="M9 5l7 7-7 7" />,
          settings: <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" />,
          book: <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.168.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
          eye: <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />,
          loader: <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" />,
          download: <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
          upload: <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />,
          moon: <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />,
          sun: <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />,
        };
        return (
          <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {icons[name]}
          </svg>
        );
      };

      // --- CONFIGURACIÓN ---
      const CONFIG = {
        dbName: "EldritchArchiveDB",
        storeName: "creatures",
        defaultFilename: "eldritch_archive_data.json",
      };

      // --- INDEXEDDB ---
      let dbInstance = null;

      async function initDB() {
        if (dbInstance) return dbInstance;
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(CONFIG.dbName, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => { dbInstance = request.result; resolve(dbInstance); };
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(CONFIG.storeName)) {
              const store = db.createObjectStore(CONFIG.storeName, { keyPath: "id" });
              store.createIndex("nombre", "nombre", { unique: false });
              store.createIndex("mitologia", "origen.mitologia", { unique: false });
              store.createIndex("nivel_peligro", "nivel_peligro", { unique: false });
            }
          };
        });
      }

      async function dbPut(creature) {
        const db = await initDB();
        const now = new Date().toISOString();
        if (!creature.created_at) creature.created_at = now;
        if (!creature.updated_at) creature.updated_at = now;
        if (!creature.status) creature.status = "active";
        return new Promise((resolve, reject) => {
          const tx = db.transaction([CONFIG.storeName], "readwrite");
          const store = tx.objectStore(CONFIG.storeName);
          const req = store.put(creature);
          req.onsuccess = () => resolve(creature);
          req.onerror = () => reject(req.error);
        });
      }

      async function dbGetAll(includeDeleted = false) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([CONFIG.storeName], "readonly");
          const store = tx.objectStore(CONFIG.storeName);
          const req = store.getAll();
          req.onsuccess = () => {
            let items = req.result;
            if (!includeDeleted) items = items.filter(c => c.status !== "deleted");
            resolve(items);
          };
          req.onerror = () => reject(req.error);
        });
      }

      async function dbGet(id) {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([CONFIG.storeName], "readonly");
          const store = tx.objectStore(CONFIG.storeName);
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function dbSoftDelete(id) {
        const creature = await dbGet(id);
        if (!creature) throw new Error("Not found");
        creature.status = "deleted";
        creature.updated_at = new Date().toISOString();
        return dbPut(creature);
      }

      async function dbClear() {
        const db = await initDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction([CONFIG.storeName], "readwrite");
          const store = tx.objectStore(CONFIG.storeName);
          const req = store.clear();
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      // --- MERGE ---
      function mergeData(localArr, remoteArr) {
        const map = new Map();
        const migrate = (c) => {
          const now = new Date().toISOString();
          if (!c.created_at) c.created_at = now;
          if (!c.updated_at) c.updated_at = now;
          if (!c.status) c.status = "active";
          return c;
        };
        localArr.forEach(c => map.set(c.id, migrate(c)));
        remoteArr.forEach(rc => {
          migrate(rc);
          if (map.has(rc.id)) {
            const lc = map.get(rc.id);
            if (new Date(rc.updated_at) > new Date(lc.updated_at)) {
              map.set(rc.id, rc);
            }
          } else {
            map.set(rc.id, rc);
          }
        });
        return Array.from(map.values());
      }

      // --- GIST API ---
      async function gistRequest(url, token, options = {}) {
        const headers = {
          Authorization: `Bearer ${token}`,
          Accept: "application/vnd.github.v3+json",
          ...options.headers,
        };
        let lastError = null;
        for (let i = 0; i < 3; i++) {
          try {
            const response = await fetch(url, { ...options, mode: "cors", headers });
            if (!response.ok) {
              const errBody = await response.json().catch(() => ({}));
              throw new Error(errBody.message || `HTTP_${response.status}`);
            }
            return await response.json();
          } catch (err) {
            lastError = err;
            if (err.message.includes("HTTP_401") || err.message.includes("HTTP_403")) break;
            await new Promise(r => setTimeout(r, 1000 * (i + 1)));
          }
        }
        throw lastError;
      }

      // --- IMAGE ZOOM LIGHTBOX (PC + mobile pinch-zoom) ---
      const ImageZoom = ({ src, onClose }) => {
        const [scale, setScale] = useState(1);
        const [pos, setPos] = useState({ x: 0, y: 0 });
        const containerRef = useRef(null);
        const dragState = useRef({ active: false, startX: 0, startY: 0, origX: 0, origY: 0 });
        const pinchState = useRef({ active: false, startDist: 0, startScale: 1 });

        useEffect(() => {
          const el = containerRef.current;
          if (!el) return;
          const onWheel = (e) => {
            e.preventDefault();
            setScale(s => Math.min(5, Math.max(0.5, s + (e.deltaY > 0 ? -0.2 : 0.2))));
          };
          el.addEventListener('wheel', onWheel, { passive: false });
          return () => el.removeEventListener('wheel', onWheel);
        }, []);

        const getDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const getMid = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });

        const startDrag = (clientX, clientY) => {
          dragState.current = { active: true, startX: clientX, startY: clientY, origX: pos.x, origY: pos.y };
        };
        const moveDrag = (clientX, clientY) => {
          if (!dragState.current.active) return;
          const dx = clientX - dragState.current.startX;
          const dy = clientY - dragState.current.startY;
          setPos({ x: dragState.current.origX + dx, y: dragState.current.origY + dy });
        };
        const endDrag = () => { dragState.current.active = false; pinchState.current.active = false; };

        const handleTouchStart = (e) => {
          if (e.touches.length === 2) {
            e.preventDefault();
            pinchState.current = { active: true, startDist: getDist(e.touches), startScale: scale };
            dragState.current.active = false;
          } else if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        };
        const handleTouchMove = (e) => {
          if (e.touches.length === 2 && pinchState.current.active) {
            e.preventDefault();
            const dist = getDist(e.touches);
            const newScale = pinchState.current.startScale * (dist / pinchState.current.startDist);
            setScale(Math.min(5, Math.max(0.5, newScale)));
            const mid = getMid(e.touches);
            if (dragState.current.active) moveDrag(mid.x, mid.y);
          } else if (e.touches.length === 1 && !pinchState.current.active) {
            moveDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        return (
          <div ref={containerRef}
            className="fixed inset-0 z-[300] bg-black/95 backdrop-blur-md flex items-center justify-center cursor-grab active:cursor-grabbing"
            style={{ touchAction: 'none' }}
            onMouseDown={(e) => { if (e.button === 0) startDrag(e.clientX, e.clientY); }}
            onMouseMove={(e) => moveDrag(e.clientX, e.clientY)}
            onMouseUp={endDrag}
            onMouseLeave={endDrag}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={endDrag}>
            <img src={src}
              className="max-w-[90vw] max-h-[90vh] select-none pointer-events-none"
              style={{ transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`, transition: dragState.current.active || pinchState.current.active ? 'none' : 'transform 0.15s' }}
              draggable="false" />
            <div className="absolute top-6 right-6 flex gap-3 z-10">
              <button onMouseDown={(e) => e.stopPropagation()} onClick={() => { setScale(1); setPos({x:0,y:0}); }}
                className="p-2 border border-emerald-900 text-emerald-500 hover:bg-emerald-500 hover:text-black transition-all text-xs font-black uppercase tracking-wider">
                1:1
              </button>
              <button onMouseDown={(e) => e.stopPropagation()} onClick={onClose}

                <Icon name="x" className="w-6 h-6" />
              </button>
            </div>
          </div>
        );
      };

      // --- APP PRINCIPAL ---
      function App() {

        const [selectedCreature, setSelectedCreature] = useState(null);
        const [page, setPage] = useState(1);
        const [showSettings, setShowSettings] = useState(false);
        const [syncStatus, setSyncStatus] = useState("");
        const [declassPhase, setDeclassPhase] = useState(-1); // -1=none, 0=accessing, 1=revealed, 2=done(stamp faded)
        const [zoomImage, setZoomImage] = useState(null);
        const [toast, setToast] = useState(null);
        const [filterDanger, setFilterDanger] = useState("");
        const [sortBy, setSortBy] = useState("nombre");
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const swipeRef = useRef({ startX: 0, startY: 0 });

        const showToast = (message, type = 'success') => setToast({ message, type, key: Date.now() });

        const [config, setConfig] = useState({
          token: localStorage.getItem("gist_token") || "",
          gistId: localStorage.getItem("gist_id") || "",
        });

        const [isEditing, setIsEditing] = useState(false);
        const [formData, setFormData] = useState({
          id: "",
          nombre: "",
          imagen_url: "",
          origen: { cultura: [], mitologia: [], periodo: "" },
          historia: "",
          descripcion_fisica: "",
          habilidades: [],
          nivel_peligro: "Bajo",
          tags: [],
        });

        const itemsPerPage = 12;

        // --- AUTO-FADE CLASIFICADO STAMP ---
        useEffect(() => {
          if (declassPhase === 1) {
            const timer = setTimeout(() => setDeclassPhase(2), 2000);
            return () => clearTimeout(timer);
          }
        }, [declassPhase]);

        // --- CARGAR DATOS (IndexedDB + Gist pull) ---
        const loadData = useCallback(async () => {
          setLoading(true);
          setError(null);
          try {
            await initDB();

            // Intentar pull desde Gist si hay config
            if (config.token && config.gistId) {
              try {
                setSyncStatus("Sincronizando...");
                const gist = await gistRequest(
                  `https://api.github.com/gists/${config.gistId.trim()}`,
                  config.token.trim()
                );
                if (gist.files[CONFIG.defaultFilename]) {
                  const remoteData = JSON.parse(gist.files[CONFIG.defaultFilename].content);
                  const localData = await dbGetAll(true);
                  const merged = mergeData(localData, remoteData);

                  await dbClear();
                  for (const c of merged) await dbPut(c);
                  setSyncStatus("Enlace_Fusionado_Activo");
                }
              } catch (pullErr) {
                console.warn("Pull failed, working offline:", pullErr);
                setSyncStatus("Modo_Offline");
              }
            } else {
              setSyncStatus("Esperando_Acreditación");
            }

            // === PURGA AUTOMÁTICA DE IDs INVÁLIDOS (TEMPORAL) ===
            // Elimina registros cuyo ID no sigue la nomenclatura ED-DDMMYYYY-XXX
            // + IDs específicos a eliminar
            const allData = await dbGetAll(true);
            const validIdPattern = /^ED-\d{8}-\d+$/;
            const blacklistedIds = ["ED-29032026-032", "ED-29032026-033"];
            const clean = allData.filter(c => validIdPattern.test(c.id) && !blacklistedIds.includes(c.id));
            const removed = allData.length - clean.length;

            if (removed > 0) {
              console.log(`[PURGA] Eliminando ${removed} registros con ID inválido`);
              await dbClear();
              for (const c of clean) await dbPut(c);

              // También limpiar el Gist si hay config
              if (config.token && config.gistId) {
                try {
                  await gistRequest(
                    `https://api.github.com/gists/${config.gistId.trim()}`,
                    config.token.trim(),
                    {
                      method: "PATCH",
                      body: JSON.stringify({
                        files: {
                          [CONFIG.defaultFilename]: { content: JSON.stringify(clean, null, 2) },
                        },
                      }),
                    }
                  );
                  console.log(`[PURGA] Gist limpiado. ${clean.length} registros válidos conservados.`);
                } catch (pushErr) {
                  console.warn("[PURGA] No se pudo limpiar el Gist:", pushErr);
                }
              }
            }
            // === FIN PURGA AUTOMÁTICA ===

            // Cargar desde IndexedDB
            const data = await dbGetAll();
            setCreatures(data);

            if (!config.token || !config.gistId) {
              setShowSettings(true);
            }
          } catch (err) {
            setError(`SISTEMA_OFFLINE: ${err.message}`);
          } finally {
            setDataReady(true);
          }
        }, [config]);

        useEffect(() => {
          if (dataReady && bootDone) setLoading(false);
        }, [dataReady, bootDone]);

        useEffect(() => { loadData(); }, [loadData]);

        // --- GUARDAR CONFIG ---
        const saveSettings = (e) => {
          e.preventDefault();
          const token = e.target.token.value.trim();
          const id = e.target.gistId.value.trim();
          if (!token || !id) return;
          localStorage.setItem("gist_token", token);
          localStorage.setItem("gist_id", id);
          setConfig({ token, gistId: id });
          setShowSettings(false);
        };

        // --- SYNC AND PUSH ---
        const syncAndPush = async (localChanges) => {
          setSaving(true);
          try {
            // Guardar en IndexedDB
            await dbClear();
            for (const c of localChanges) await dbPut(c);

            // Si hay config de Gist, sincronizar
            if (config.token && config.gistId) {
              // Pull remoto para merge
              let remoteData = [];
              try {
                const gist = await gistRequest(
                  `https://api.github.com/gists/${config.gistId.trim()}`,
                  config.token.trim()
                );
                if (gist.files[CONFIG.defaultFilename]) {
                  remoteData = JSON.parse(gist.files[CONFIG.defaultFilename].content);
                }
              } catch (e) { console.warn("Pull before push failed:", e); }

              // Merge
              const allLocal = await dbGetAll(true);
              const merged = mergeData(remoteData, allLocal);

              // Push
              await gistRequest(
                `https://api.github.com/gists/${config.gistId.trim()}`,
                config.token.trim(),
                {
                  method: "PATCH",
                  body: JSON.stringify({
                    files: {
                      [CONFIG.defaultFilename]: { content: JSON.stringify(merged, null, 2) },
                    },
                  }),
                }
              );

              // Guardar merged en IndexedDB
              await dbClear();
              for (const c of merged) await dbPut(c);

              const active = merged.filter(c => c.status !== "deleted");
              setCreatures(active);
              setSyncStatus("Enlace_Fusionado_Activo");
            } else {
              const active = localChanges.filter(c => c.status !== "deleted");
              setCreatures(active);
            }

            setSaving(false);
            return true;
          } catch (err) {
            alert(`ERROR_DE_SINCRONIZACIÓN: ${err.message}`);
            setSaving(false);
            return false;
          }
        };

        // --- GUARDAR CRIATURA ---
        const handleSave = async (e) => {
          e.preventDefault();
          const nowIso = new Date().toISOString();
          let allCreatures = await dbGetAll(true);

          if (isEditing) {
            allCreatures = allCreatures.map(c =>
              c.id === formData.id ? { ...formData, updated_at: nowIso, status: c.status || "active", created_at: c.created_at } : c
            );
          } else {
            const now = new Date();
            const datePart = `${String(now.getDate()).padStart(2, "0")}${String(now.getMonth() + 1).padStart(2, "0")}${now.getFullYear()}`;
            const prefix = `ED-${datePart}-`;
            const maxSeq = allCreatures.reduce((max, c) => {
              if (c.id && c.id.startsWith(prefix)) {
                const seq = parseInt(c.id.split("-").pop(), 10);
                return seq > max ? seq : max;
              }
              return max;
            }, 0);
            const id = `${prefix}${String(maxSeq + 1).padStart(3, "0")}`;
            const newItem = {
              ...formData,
              id,
              created_at: nowIso,
              updated_at: nowIso,
              status: "active",
            };
            allCreatures = [...allCreatures, newItem];
          }

          if (await syncAndPush(allCreatures)) {
            setView("explorer");
            setIsEditing(false);
            showToast(isEditing ? '✅ Registro actualizado' : '✅ Nuevo registro creado');
          }
        };

        // --- ELIMINAR ---
        const handleDelete = (id) => {
          const creature = creatures.find(c => c.id === id);
          setDeleteConfirm(creature);
        };
        const confirmDelete = async () => {
          if (!deleteConfirm) return;
          const id = deleteConfirm.id;
          setDeleteConfirm(null);
          
          let allCreatures = await dbGetAll(true);
          const updated = allCreatures.map(c =>
            c.id === id ? { ...c, status: "deleted", updated_at: new Date().toISOString() } : c
          );
          
          const success = await syncAndPush(updated);
          if (success) {
            setSelectedCreature(null);
            showToast('🗑️ Registro eliminado');
          }
        };

        // --- ABRIR EDITOR ---
        const openEditor = (creature = null) => {
          if (creature) {
            const toArr = (v) => Array.isArray(v) ? v : (v ? [v] : []);
            setFormData({
              ...creature,
              origen: {
                cultura: toArr(creature.origen?.cultura),
                mitologia: toArr(creature.origen?.mitologia),
                periodo: creature.origen?.periodo || "",
              },
              habilidades: creature.habilidades || [],
              tags: creature.tags || [],
            });
            setIsEditing(true);
          } else {
            setFormData({
              nombre: "",
              imagen_url: "",
              origen: { cultura: [], mitologia: [], periodo: "" },
              historia: "",
              descripcion_fisica: "",
              habilidades: [],
              nivel_peligro: "Bajo",
              tags: [],
            });
            setIsEditing(false);
          }
          setView("editor");
          setSelectedCreature(null);
        };

        // --- PULL / PUSH MANUALES ---
        const manualPull = async () => {
          setSaving(true);
          setSyncStatus("Descargando...");
          try {
            const gist = await gistRequest(
              `https://api.github.com/gists/${config.gistId.trim()}`,
              config.token.trim()
            );
            if (!gist.files[CONFIG.defaultFilename]) throw new Error("FILE_NOT_FOUND");
            const remoteData = JSON.parse(gist.files[CONFIG.defaultFilename].content);
            const localData = await dbGetAll(true);
            const merged = mergeData(localData, remoteData);
            await dbClear();
            for (const c of merged) await dbPut(c);
            const active = merged.filter(c => c.status !== "deleted");
            setCreatures(active);
            setSyncStatus("Enlace_Fusionado_Activo");
            showToast(`✅ ${active.length} criaturas sincronizadas`);
          } catch (err) {
            showToast(`Error: ${err.message}`, "error");
            setSyncStatus("Error_Sync");
          } finally {
            setSaving(false);
          }
        };

        const manualPush = async () => {
          setSaving(true);
          setSyncStatus("Subiendo...");
          try {
            const allLocal = await dbGetAll(true);
            // Pull first
            let remoteData = [];
            try {
              const gist = await gistRequest(
                `https://api.github.com/gists/${config.gistId.trim()}`,
                config.token.trim()
              );
              if (gist.files[CONFIG.defaultFilename]) {
                remoteData = JSON.parse(gist.files[CONFIG.defaultFilename].content);
              }
            } catch (e) {}
            const merged = mergeData(remoteData, allLocal);
            await gistRequest(
              `https://api.github.com/gists/${config.gistId.trim()}`,
              config.token.trim(),
              {
                method: "PATCH",
                body: JSON.stringify({
                  files: {
                    [CONFIG.defaultFilename]: { content: JSON.stringify(merged, null, 2) },
                  },
                }),
              }
            );
            await dbClear();
            for (const c of merged) await dbPut(c);
            const active = merged.filter(c => c.status !== "deleted");
            setCreatures(active);
            setSyncStatus("Enlace_Fusionado_Activo");
            showToast(`✅ ${active.length} criaturas subidas`);
          } catch (err) {
            showToast(`Error: ${err.message}`, "error");
            setSyncStatus("Error_Sync");
          } finally {
            setSaving(false);
          }
        };

        // --- CATÁLOGO DE MITOLOGÍAS ---
        const allMythologies = useMemo(() => {
          const set = new Set();
          creatures.forEach(c => {
            if (c.status === 'deleted') return;
            const m = c.origen?.mitologia;
            if (Array.isArray(m)) m.forEach(v => v && set.add(v));
            else if (m) set.add(m);
          });
          return [...set].sort();
        }, [creatures]);

        // --- FILTRO Y ORDENAMIENTO ---
        const dangerOrder = { 'Bajo': 1, 'Medio': 2, 'Alto': 3, 'Muy Alto': 4, 'Extremo': 5, 'Absoluto': 6 };

        const filtered = useMemo(() => {
          let result = creatures.filter(c => {
            if (c.status === 'deleted') return false;
            if (search && !(c.nombre || '').toLowerCase().includes(search.toLowerCase())) return false;
            if (filterMito) {
              const m = c.origen?.mitologia;
              const arr = Array.isArray(m) ? m : (m ? [m] : []);
              if (!arr.some(v => v === filterMito)) return false;
            }
            if (filterDanger && c.nivel_peligro !== filterDanger) return false;
            return true;
          });
          // Sort
          result.sort((a, b) => {
            if (sortBy === 'nombre') return (a.nombre || '').localeCompare(b.nombre || '');
            if (sortBy === 'reciente') return new Date(b.created_at || 0) - new Date(a.created_at || 0);
            if (sortBy === 'antiguo') return new Date(a.created_at || 0) - new Date(b.created_at || 0);
            if (sortBy === 'peligro_asc') return (dangerOrder[a.nivel_peligro] || 0) - (dangerOrder[b.nivel_peligro] || 0);
            if (sortBy === 'peligro_desc') return (dangerOrder[b.nivel_peligro] || 0) - (dangerOrder[a.nivel_peligro] || 0);
            return 0;
          });
          return result;
        }, [creatures, search, filterMito, filterDanger, sortBy]);

        const currentItems = filtered.slice((page - 1) * itemsPerPage, page * itemsPerPage);
        const totalPages = Math.ceil(filtered.length / itemsPerPage);

        // --- SWIPE NAVIGATION ---
        const navigateCreature = (dir) => {
          if (!selectedCreature) return;
          const idx = filtered.findIndex(c => c.id === selectedCreature.id);
          if (idx === -1) return;
          const next = dir === 'next' ? filtered[(idx + 1) % filtered.length] : filtered[(idx - 1 + filtered.length) % filtered.length];
          setDeclassPhase(0);
          setSelectedCreature(next);
        };
        const handleSwipeStart = (e) => {
          const t = e.touches[0];
          swipeRef.current = { startX: t.clientX, startY: t.clientY };
        };
        const handleSwipeEnd = (e) => {
          const t = e.changedTouches[0];
          const dx = t.clientX - swipeRef.current.startX;
          const dy = t.clientY - swipeRef.current.startY;
          if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx < 0) navigateCreature('next');
            else navigateCreature('prev');
          }
        };

        // --- LOADING SCREEN ---
        if (loading) return <TerminalBoot onComplete={() => setBootDone(true)} />;

        // --- RENDER ---
        return (
          <div className="min-h-screen relative overflow-hidden pb-20">
            <header className="relative z-10 pt-10 pb-6 border-b border-emerald-900/40 px-6 bg-black/60 backdrop-blur-md">
              <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                <div onClick={() => setView("explorer")} className="cursor-pointer text-center md:text-left">
                  <h1 className="text-4xl md:text-5xl font-black tracking-tighter uppercase italic leading-none">
                    <GlitchText>ELDRITCH DOSSIER</GlitchText>
                  </h1>
                  <p className="text-[9px] text-emerald-800 mt-2 tracking-[0.4em] font-black uppercase leading-none">
                    Terminal_Eldritch_Dossier_CEI
                  </p>
                </div>
                <div className="flex items-center gap-4">
                  <button onClick={() => setView("explorer")}
                    className={`px-4 py-2 border text-[10px] font-bold uppercase flex items-center gap-2 transition-all ${view === "explorer" ? "bg-emerald-500 text-black border-emerald-500" : "border-emerald-900 text-emerald-900 hover:text-emerald-500"}`}>
                    <Icon name="database" /> Explorar
                  </button>
                  <button onClick={() => openEditor()}
                    className={`px-4 py-2 border text-[10px] font-bold uppercase flex items-center gap-2 transition-all ${view === "editor" ? "bg-emerald-500 text-black border-emerald-500" : "border-emerald-900 text-emerald-900 hover:text-emerald-500"}`}>
                    <Icon name="plus" /> Registrar
                  </button>

                  <button onClick={() => setShowSettings(true)}
                    className="p-2 border border-emerald-900 text-emerald-900 hover:text-emerald-500 hover:border-emerald-500 transition-colors">
                    <Icon name="settings" />
                  </button>
                </div>
              </div>
            </header>

            {error && (
              <div className="relative z-20 bg-red-950/20 border-b border-red-900/50 p-4 text-center text-[10px] font-bold text-red-500 animate-pulse uppercase tracking-widest">
                [ ADVERTENCIA_CRÍTICA ] : {error}
              </div>
            )}

            {/* === EXPLORER === */}
            {/* === TOAST === */}
            {toast && <Toast key={toast.key} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

            {view === "explorer" ? (
              <main className="relative z-10 max-w-[95vw] xl:max-w-[90vw] mx-auto p-8 animate-in fade-in duration-500">

                {/* === CRIATURA DEL DÍA === */}
                {(() => {
                  if (creatures.length === 0) return null;
                  const today = new Date();
                  const seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
                  const dailyCreature = creatures[seed % creatures.length];
                  if (!dailyCreature) return null;
                  return <DailyCreatureWidget creature={dailyCreature} onOpen={(c) => { setDeclassPhase(0); setSelectedCreature(c); }} />;
                })()}

                <div className="mb-10 border-l-2 border-emerald-500 pl-4 md:pl-6 py-3 pr-4 md:pr-6 bg-emerald-950/10 uppercase font-bold text-[10px] space-y-3">
                  {/* Row 1: Search + count + refresh */}
                  <div className="flex items-center gap-3">
                    <div className="text-emerald-600 tracking-widest text-xs shrink-0 hidden md:block">
                      Registros: {filtered.length}
                    </div>
                    <div className="text-emerald-600 tracking-widest text-xs shrink-0 md:hidden">
                      [{filtered.length}]
                    </div>
                    <div className="relative flex-1 group">
                      <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 text-emerald-900 group-focus-within:text-emerald-500" />
                      <input type="text" placeholder="BUSCAR..."
                        className="w-full bg-black border border-emerald-900/30 py-2 pl-10 pr-4 text-[10px] focus:border-emerald-500 outline-none placeholder:text-emerald-950 uppercase"
                        value={search}
                        onChange={(e) => { setSearch(e.target.value); setPage(1); }}
                      />
                    </div>
                    <button onClick={loadData} disabled={saving}
                      className="text-emerald-900 hover:text-emerald-500 flex items-center transition-colors disabled:opacity-30 shrink-0">
                      <Icon name="refresh" />
                    </button>
                  </div>
                  {/* Row 2: Filters in a compact grid */}
                  <div className="grid grid-cols-3 gap-2 md:flex md:gap-3">
                    <select
                      className="bg-black border border-emerald-900/30 py-2 px-2 md:px-3 text-[9px] md:text-[10px] text-emerald-500 outline-none uppercase font-bold cursor-pointer hover:border-emerald-500 transition-colors min-w-0 truncate"
                      value={filterMito}
                      onChange={(e) => { setFilterMito(e.target.value); setPage(1); }}>
                      <option value="">Mitolog&iacute;a</option>
                      {allMythologies.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                    <select
                      className="bg-black border border-emerald-900/30 py-2 px-2 md:px-3 text-[9px] md:text-[10px] text-emerald-500 outline-none uppercase font-bold cursor-pointer hover:border-emerald-500 transition-colors min-w-0 truncate"
                      value={filterDanger}
                      onChange={(e) => { setFilterDanger(e.target.value); setPage(1); }}>
                      <option value="">Nivel</option>
                      {['Bajo','Medio','Alto','Muy Alto','Extremo','Absoluto'].map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                    <select
                      className="bg-black border border-emerald-900/30 py-2 px-2 md:px-3 text-[9px] md:text-[10px] text-emerald-500 outline-none uppercase font-bold cursor-pointer hover:border-emerald-500 transition-colors min-w-0 truncate"
                      value={sortBy}
                      onChange={(e) => { setSortBy(e.target.value); setPage(1); }}>
                      <option value="nombre">A &rarr; Z</option>
                      <option value="reciente">Reciente</option>
                      <option value="antiguo">Antiguo</option>
                      <option value="peligro_desc">&uarr; Peligro</option>
                      <option value="peligro_asc">&darr; Peligro</option>
                    </select>
                  </div>
                </div>

                {filtered.length === 0 ? (
                  <div className="text-center py-24 opacity-30 uppercase font-black tracking-[0.5em] italic">
                    No hay registros recuperados
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {currentItems.map((c) => {
                      const openCreature = (creature) => { setDeclassPhase(0); setSelectedCreature(creature); };
                      const dangerClass = c.nivel_peligro === 'Absoluto' ? 'card-danger-absolute' : c.nivel_peligro === 'Extremo' ? 'card-danger-extreme' : '';
                      return (
                      <div key={c.id} onClick={() => openCreature(c)}
                        className={`group cursor-pointer bg-black border border-emerald-950 hover:border-emerald-500/40 transition-all p-1 shadow-lg overflow-hidden ${dangerClass}`}>
                        <div className={`relative h-56 overflow-hidden border border-emerald-950 bg-emerald-950/5 ${c.nivel_peligro === 'Absoluto' ? 'card-img-wrap' : ''}`}>
                          <img src={c.imagen_url}
                            className="w-full h-full object-cover grayscale opacity-40 group-hover:grayscale-0 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700"
                            onError={(e) => (e.target.src = "https://placehold.co/400x300/000/080?text=S/N_FOTOGRAFICA")}
                          />
                          <div className="absolute top-2 right-2">
                            <DangerBadge level={c.nivel_peligro} />
                          </div>
                          <div className="absolute bottom-0 left-0 right-0 bg-black/80 p-4 border-t border-emerald-950/50 backdrop-blur-sm">
                            <div className="text-[8px] text-emerald-900 mb-1 font-black tracking-widest">{c.id}</div>
                            <h3 className={`text-xl font-black uppercase italic tracking-tighter group-hover:text-white transition-colors leading-none ${c.nivel_peligro === 'Absoluto' ? 'card-name-absoluto' : 'text-emerald-500'}`}>
                              {c.nombre}
                            </h3>
                          </div>
                        </div>
                      </div>
                    ); })}
                  </div>
                )}
                {totalPages > 1 && (
                  <div className="mt-16 flex justify-center items-center gap-8 text-[10px] font-black uppercase text-emerald-900">
                    <button disabled={page === 1} onClick={() => setPage(p => p - 1)}
                      className="p-3 border border-emerald-950 hover:border-emerald-500 disabled:opacity-20 transition-all">
                      <Icon name="left" />
                    </button>
                    <span className="tracking-[0.4em]">Sector {page} / {totalPages}</span>
                    <button disabled={page === totalPages} onClick={() => setPage(p => p + 1)}
                      className="p-3 border border-emerald-950 hover:border-emerald-500 disabled:opacity-20 transition-all">
                      <Icon name="right" />
                    </button>
                  </div>
                )}
              </main>
            ) : (
              /* === EDITOR === */
              <main className="relative z-10 max-w-4xl mx-auto p-8 animate-in slide-in-from-bottom-4 duration-500">
                <form onSubmit={handleSave}
                  className="grid grid-cols-1 md:grid-cols-2 gap-8 bg-black border border-emerald-900/40 p-10 shadow-2xl relative overflow-hidden">
                  <div className="space-y-6">
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Identidad</label>
                      <input required className="w-full bg-emerald-950/10 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none focus:border-emerald-500"
                        value={formData.nombre}
                        onChange={(e) => setFormData({ ...formData, nombre: e.target.value })}
                      />
                    </div>
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Captura Visual (URL)</label>
                      <input required className="w-full bg-emerald-950/10 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none focus:border-emerald-500"
                        value={formData.imagen_url}
                        onChange={(e) => setFormData({ ...formData, imagen_url: e.target.value })}
                      />
                      {formData.imagen_url && (
                        <div className="mt-2 border border-emerald-900/30 bg-emerald-950/5 p-1 relative group">
                          <img src={formData.imagen_url}
                            className="w-full h-28 object-cover opacity-70 group-hover:opacity-100 transition-opacity"
                            onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                            onLoad={(e) => { e.target.style.display = 'block'; if(e.target.nextSibling) e.target.nextSibling.style.display = 'none'; }}
                          />
                          <div className="w-full h-28 items-center justify-center text-[9px] text-red-500 uppercase font-black tracking-widest" style={{display:'none'}}>
                            [ URL_Inválida ]
                          </div>
                        </div>
                      )}
                    </div>
                    <ChipInput
                      items={formData.origen.cultura}
                      onChange={(items) => setFormData({ ...formData, origen: { ...formData.origen, cultura: items } })}
                      placeholder="Agregar cultura..."
                      label="Cultura(s) de Origen"
                    />
                    <ChipInput
                      items={formData.origen.mitologia}
                      onChange={(items) => setFormData({ ...formData, origen: { ...formData.origen, mitologia: items } })}
                      placeholder="Agregar mitología..."
                      label="Mitología(s)"
                    />
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Período de Avistamiento</label>
                      <input className="w-full bg-emerald-950/10 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none focus:border-emerald-500"
                        value={formData.origen.periodo}
                        onChange={(e) => setFormData({ ...formData, origen: { ...formData.origen, periodo: e.target.value } })}
                      />
                    </div>
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Nivel de Amenaza</label>
                      <select className="w-full bg-emerald-950/20 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none cursor-pointer"
                        value={formData.nivel_peligro}
                        onChange={(e) => setFormData({ ...formData, nivel_peligro: e.target.value })}>
                        {["Bajo", "Medio", "Alto", "Muy Alto", "Extremo", "Absoluto"].map(lvl =>
                          <option key={lvl} value={lvl}>{lvl}</option>
                        )}
                      </select>
                    </div>
                  </div>
                  <div className="space-y-6">
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Trasfondo</label>
                      <textarea className="w-full h-24 bg-emerald-950/10 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none resize-none focus:border-emerald-500"
                        value={formData.historia}
                        onChange={(e) => setFormData({ ...formData, historia: e.target.value })}
                      />
                    </div>
                    <div>
                      <label className="text-[9px] uppercase font-black text-emerald-900 block mb-1 tracking-widest italic">Morfología</label>
                      <textarea className="w-full h-24 bg-emerald-950/10 border border-emerald-900 p-3 text-xs text-emerald-400 outline-none resize-none focus:border-emerald-500"
                        value={formData.descripcion_fisica}
                        onChange={(e) => setFormData({ ...formData, descripcion_fisica: e.target.value })}
                      />
                    </div>
                    {/* CHIP INPUTS */}
                    <ChipInput
                      items={formData.habilidades}
                      onChange={(items) => setFormData({ ...formData, habilidades: items })}
                      placeholder="Agregar habilidad..."
                      label="Atributos (Habilidades)"
                    />
                    <ChipInput
                      items={formData.tags}
                      onChange={(items) => setFormData({ ...formData, tags: items })}
                      placeholder="Agregar etiqueta..."
                      label="Etiquetas (Tags)"
                    />
                  </div>
                  <div className="md:col-span-2 pt-6 border-t border-emerald-900 flex justify-end gap-4 font-black uppercase text-[10px]">
                    <button type="button" onClick={() => setView("explorer")}
                      className="px-8 py-3 text-emerald-900 hover:text-red-500 transition-colors">Abortar</button>
                    <button type="submit" disabled={saving}
                      className="px-10 py-3 bg-emerald-900/20 border border-emerald-500 flex items-center gap-3 hover:bg-emerald-500 hover:text-black transition-all">
                      {saving ? <Icon name="loader" className="animate-spin" /> : <Icon name="save" />}
                      {isEditing ? "Guardar" : "Guardar"}
                    </button>
                  </div>
                </form>
              </main>
            )}

            {/* === CONFIRM DELETE MODAL === */}
            {deleteConfirm && (
              <ConfirmDeleteModal
                creature={deleteConfirm}
                onConfirm={confirmDelete}
                onCancel={() => setDeleteConfirm(null)}
              />

            {/* === MODAL DETALLE === */}
            {selectedCreature && (
              <div className="fixed inset-0 z-[150] flex items-center justify-center p-0 md:p-8"
                onTouchStart={handleSwipeStart}
                onTouchEnd={handleSwipeEnd}>
                <div className="absolute inset-0 bg-black/95 backdrop-blur-sm" onClick={() => { setSelectedCreature(null); setDeclassPhase(-1); }}></div>
                <div className={`relative w-full max-w-5xl bg-black border-0 md:border shadow-2xl flex flex-col md:flex-row max-h-[100vh] md:max-h-[90vh] overflow-y-auto md:overflow-hidden ${selectedCreature.nivel_peligro === 'Absoluto' ? 'border-purple-500/30' : 'border-emerald-500/30'}`}>

                  {/* === SWIPE INDICATORS (mobile) === */}
                  {declassPhase !== 0 && filtered.length > 1 && (
                    <>
                      <button onClick={() => navigateCreature('prev')}
                        className="hidden md:flex absolute left-[-50px] top-1/2 -translate-y-1/2 z-30 p-2 text-emerald-900 hover:text-emerald-500 transition-colors">
                        <Icon name="left" className="w-6 h-6" />
                      </button>
                      <button onClick={() => navigateCreature('next')}
                        className="hidden md:flex absolute right-[-50px] top-1/2 -translate-y-1/2 z-30 p-2 text-emerald-900 hover:text-emerald-500 transition-colors">
                        <Icon name="right" className="w-6 h-6" />
                      </button>

                    <DeclassifyOverlay
                      creatureId={selectedCreature.id}
                      dangerLevel={selectedCreature.nivel_peligro}
                      onComplete={() => setDeclassPhase(1)}
                    />

                  {/* === CLASIFICADO STAMP === */}
                  {(declassPhase === 1 || declassPhase === 2) && ['Muy Alto','Extremo','Absoluto'].includes(selectedCreature.nivel_peligro) && (
                    <div className={`absolute top-1/2 left-1/2 z-40 pointer-events-none ${declassPhase === 1 ? 'declass-stamp' : 'declass-stamp-fade'}`}>

                          ALTO_RIESGO
                        </div>
                      ) : (
                        <div className="border-4 border-red-600 px-6 py-3 text-red-600 font-black text-2xl md:text-4xl uppercase tracking-[0.3em] whitespace-nowrap" style={{textShadow: '0 0 10px rgba(220,38,38,0.5)'}}>
                          CLASIFICADO
                        </div>
                      )}

                      <Icon name="x" className="w-6 h-6" />
                    </button>

                  <div onClick={() => declassPhase !== 0 && setZoomImage(selectedCreature.imagen_url)}

                      </div>
                      <button onClick={() => { setSelectedCreature(null); setDeclassPhase(-1); }}

                        <Icon name="x" className="w-8 h-8" />
                      </button>
                    </div>
                    <div className={`grid grid-cols-3 gap-6 border-y border-emerald-900/30 py-6 text-[9px] uppercase font-black tracking-widest leading-tight ${declassPhase === 1 ? 'declass-field' : ''}`} style={declassPhase === 1 ? {animationDelay: '0.6s'} : {}}>
                      <div>
                        <div className="text-emerald-900 mb-2 italic opacity-50">Cultura</div>
                        <div className="flex flex-wrap gap-1">

                      </div>
                      <div>
                        <div className="text-emerald-900 mb-2 italic opacity-50">Mitología</div>
                        <div className="flex flex-wrap gap-1">
                          {(() => { const m = selectedCreature.origen?.mitologia || selectedCreature.origen?.mitología; const arr = Array.isArray(m) ? m : (m ? [m] : []); return arr.length > 0 ? arr.map((t,i) => <span key={i} className="chip-tag text-[8px] py-0.5 px-1.5">{t}</span>) : <span className="text-emerald-400">---</span>; })()}
                        </div>
                      </div>
                      <div>
                        <div className="text-emerald-900 mb-2 italic opacity-50">Período</div>
                        <div className="text-emerald-400">{selectedCreature.origen?.periodo || "---"}</div>
                      </div>
                    </div>
                    <div className={`space-y-8 ${declassPhase === 1 ? 'declass-field' : ''}`} style={declassPhase === 1 ? {animationDelay: '0.9s'} : {}}>
                      <div className="space-y-2">
                        <h4 className={`text-[10px] font-black uppercase flex items-center gap-2 border-b pb-1 tracking-widest ${selectedCreature.nivel_peligro === 'Absoluto' ? 'text-purple-400 border-purple-900' : 'text-emerald-500 border-emerald-900'}`}>
                          <Icon name="book" /> Bitácora de Origen
                        </h4>
                        <p className={`text-xs leading-relaxed italic font-serif text-justify ${selectedCreature.nivel_peligro === 'Absoluto' ? 'text-purple-300/70' : 'text-emerald-600'}`}

                      </div>
                      <div className="space-y-2">
                        <h4 className={`text-[10px] font-black uppercase flex items-center gap-2 border-b pb-1 tracking-widest ${selectedCreature.nivel_peligro === 'Absoluto' ? 'text-purple-400 border-purple-900' : 'text-emerald-500 border-emerald-900'}`}>
                          <Icon name="eye" /> Análisis Morfológico
                        </h4>
                        <p className={`text-xs leading-relaxed italic font-serif text-justify ${selectedCreature.nivel_peligro === 'Absoluto' ? 'text-purple-300/70' : 'text-emerald-600'}`}
                          dangerouslySetInnerHTML={{ __html: selectedCreature.descripcion_fisica || "S/N" }} />
                      </div>
                    </div>
                    <div className={`space-y-4 pt-6 border-t ${selectedCreature.nivel_peligro === 'Absoluto' ? 'border-purple-900/30' : 'border-emerald-900/30'} ${declassPhase === 1 ? 'declass-field' : ''}`} style={declassPhase === 1 ? {animationDelay: '1.2s'} : {}}>
                      <div className="flex flex-wrap gap-2">
                        {selectedCreature.habilidades?.map((h) => (
                          <span key={h} className={`text-[9px] border px-3 py-1 uppercase font-black ${selectedCreature.nivel_peligro === 'Absoluto' ? 'border-purple-800 text-purple-400 bg-purple-950/20' : 'border-emerald-900 text-emerald-500 bg-emerald-950/20'}`}>{h}</span>
                        ))}
                      </div>
                      <div className="flex flex-wrap gap-2 opacity-50">
                        {selectedCreature.tags?.map((t) => (
                          <span key={t} className={`text-[8px] font-black italic tracking-widest uppercase ${selectedCreature.nivel_peligro === 'Absoluto' ? 'text-purple-700' : 'text-emerald-800'}`}>#{t}</span>
                        ))}
                      </div>
                    </div>
                    <div className={`pt-10 grid grid-cols-2 gap-4 pb-4 ${declassPhase === 1 ? 'declass-field' : ''}`} style={declassPhase === 1 ? {animationDelay: '1.5s'} : {}}>
                      <button onClick={() => openEditor(selectedCreature)}
                        className="flex items-center justify-center gap-2 py-4 bg-emerald-900/10 border border-emerald-800 text-[10px] font-black uppercase hover:bg-emerald-500 hover:text-black transition-all tracking-[0.2em]">
                        <Icon name="edit" /> Modificar
                      </button>
                      <button onClick={() => handleDelete(selectedCreature.id)}
                        className="flex items-center justify-center gap-2 py-4 bg-red-900/10 border border-red-900 text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition-all tracking-[0.2em]">
                        <Icon name="trash" /> Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* === MODAL SETTINGS === */}
            {showSettings && (
              <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 animate-in fade-in duration-300">
                <div className="absolute inset-0 bg-black/95 backdrop-blur-md"
                  onClick={() => creatures.length > 0 && setShowSettings(false)}></div>
                <form onSubmit={saveSettings}
                  className="relative w-full max-w-md bg-black border-2 border-emerald-500 p-10 shadow-[0_0_120px_rgba(16,185,129,0.2)]">
                  <h3 className="text-xl font-black uppercase mb-8 flex items-center gap-3 tracking-tighter italic border-b border-emerald-900 pb-4">
                    <Icon name="settings" className="w-6 h-6" /> Protocolo de Acceso
                  </h3>
                  <div className="space-y-6">
                    <div>
                      <label className="text-[10px] uppercase font-black text-emerald-900 block mb-2 tracking-widest italic text-center">
                        GitHub Secret Token
                      </label>
                      <input name="token" type="password" required defaultValue={config.token}
                        className="w-full bg-emerald-950/10 border border-emerald-900 p-4 text-xs text-emerald-400 outline-none focus:border-emerald-500 placeholder:opacity-20"
                        placeholder="ghp_xxxxxxxxxxxx" />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase font-black text-emerald-900 block mb-2 tracking-widest italic text-center">
                        Target Archive ID (Gist ID)
                      </label>
                      <input name="gistId" required defaultValue={config.gistId}
                        className="w-full bg-emerald-950/10 border border-emerald-900 p-4 text-xs text-emerald-400 outline-none focus:border-emerald-500 placeholder:opacity-20"
                        placeholder="ID del registro..." />
                    </div>
                  </div>

                  {/* Botones Pull / Push */}
                  {config.token && config.gistId && (
                    <div className="mt-6 grid grid-cols-2 gap-3 font-black uppercase text-[10px]">
                      <button type="button" onClick={manualPull} disabled={saving}
                        className="py-3 border border-emerald-900 text-emerald-600 hover:bg-emerald-900/20 transition-all flex items-center justify-center gap-2 disabled:opacity-30">
                        <Icon name="download" /> Pull
                      </button>
                      <button type="button" onClick={manualPush} disabled={saving}
                        className="py-3 border border-emerald-900 text-emerald-600 hover:bg-emerald-900/20 transition-all flex items-center justify-center gap-2 disabled:opacity-30">
                        <Icon name="upload" /> Push
                      </button>
                    </div>
                  )}

                  <div className="mt-10 flex gap-4 font-black uppercase text-[10px]">
                    <button type="button" onClick={() => creatures.length > 0 && setShowSettings(false)}
                      className="flex-1 py-4 border border-emerald-900 text-emerald-900 hover:text-red-500 transition-colors uppercase">
                      Abortar
                    </button>
                    <button type="submit"
                      className="flex-1 py-4 bg-emerald-500 text-black hover:bg-white transition-all tracking-[0.2em] font-black uppercase">
                      Vincular
                    </button>
                  </div>
                </form>
              </div>
            )}

            <footer className="fixed bottom-0 left-0 right-0 p-5 border-t border-emerald-950 bg-black/90 flex justify-between items-center px-10 text-[9px] font-black text-emerald-950 tracking-[0.3em] uppercase backdrop-blur-md z-[120]">
              <div className="hidden sm:block italic opacity-60">
                Eldritch_Dossier_CEI // V5.1_07042026
              </div>
              <div className="animate-pulse flex items-center gap-3">
                <div className={`w-1.5 h-1.5 rounded-full shadow-[0_0_5px_#10b981] ${creatures.length > 0 ? "bg-emerald-500" : "bg-red-600 animate-ping"}`}></div>
                {syncStatus || (creatures.length > 0 ? "Enlace_Fusionado_Activo" : "Esperando_Acreditación")}
              </div>
            </footer>
          </div>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>

    <!-- Distortion Click Sound -->
    <script>
      (function() {
        let audioCtx = null;
        function getAudioCtx() {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          return audioCtx;
        }
        function playDistortionClick() {
          try {
            const ctx = getAudioCtx();
            const duration = 0.06;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const distortion = ctx.createWaveShaper();

            const samples = 256;
            const curve = new Float32Array(samples);
            for (let i = 0; i < samples; i++) {
              const x = (i * 2) / samples - 1;
              curve[i] = (Math.PI + 200) * x / (Math.PI + 200 * Math.abs(x));
            }
            distortion.curve = curve;
            distortion.oversample = '4x';

            osc.type = 'square';
            osc.frequency.setValueAtTime(180 + Math.random() * 80, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + duration);

            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

            osc.connect(distortion);
            distortion.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + duration);
          } catch(e) {}
        }

        document.addEventListener('click', function(e) {
          const el = e.target.closest('button, a, .cursor-pointer, [onclick]');
          if (el) playDistortionClick();
        }, true);
      })();
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("✅ Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.log("❌ Service Worker registration failed:", error);
            });
        });
      }
    </script>
