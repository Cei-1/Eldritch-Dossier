    <!-- CRT Terminal Sound System -->
    <script>
      (function () {
        let audioCtx = null;
        function getCtx() {
          if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        }

        // Create a noise buffer (used for static/crackle textures)
        function createNoiseBuffer(ctx, duration) {
          const len = ctx.sampleRate * duration;
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
          return buf;
        }

        // === PRIMARY CLICK: CRT electromagnetic relay snap ===
        function playCRTClick() {
          try {
            const ctx = getCtx();
            const t = ctx.currentTime;
            const master = ctx.createGain();
            master.gain.setValueAtTime(0.12, t);
            master.connect(ctx.destination);

            // Layer 1: Sharp transient pop (relay contact)
            const pop = ctx.createOscillator();
            const popGain = ctx.createGain();
            const popFilter = ctx.createBiquadFilter();
            pop.type = "square";
            pop.frequency.setValueAtTime(2200 + Math.random() * 600, t);
            pop.frequency.exponentialRampToValueAtTime(200, t + 0.015);
            popFilter.type = "bandpass";
            popFilter.frequency.setValueAtTime(1800, t);
            popFilter.Q.setValueAtTime(2, t);
            popGain.gain.setValueAtTime(0.6, t);
            popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
            pop.connect(popFilter);
            popFilter.connect(popGain);
            popGain.connect(master);
            pop.start(t);
            pop.stop(t + 0.03);

            // Layer 2: Sub-bass thud (CRT degauss feel)
            const sub = ctx.createOscillator();
            const subGain = ctx.createGain();
            sub.type = "sine";
            sub.frequency.setValueAtTime(65 + Math.random() * 20, t);
            sub.frequency.exponentialRampToValueAtTime(30, t + 0.06);
            subGain.gain.setValueAtTime(0.35, t);
            subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
            sub.connect(subGain);
            subGain.connect(master);
            sub.start(t);
            sub.stop(t + 0.08);

            // Layer 3: Noise crackle (static discharge)
            const noise = ctx.createBufferSource();
            noise.buffer = createNoiseBuffer(ctx, 0.04);
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = "highpass";
            noiseFilter.frequency.setValueAtTime(3000, t);
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.08, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(master);
            noise.start(t);

            // Layer 4: Resonant ring (electromagnetic whine)
            const ring = ctx.createOscillator();
            const ringGain = ctx.createGain();
            ring.type = "sine";
            ring.frequency.setValueAtTime(4800 + Math.random() * 400, t);
            ringGain.gain.setValueAtTime(0.02, t);
            ringGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            ring.connect(ringGain);
            ringGain.connect(master);
            ring.start(t);
            ring.stop(t + 0.06);
          } catch (e) {}
        }

        // === CRITICAL CLICK: Glitch/Error artifact sound ===
        function playGlitchClick() {
          try {
            const ctx = getCtx();
            const t = ctx.currentTime;
            const master = ctx.createGain();
            master.gain.setValueAtTime(0.15, t);
            master.connect(ctx.destination);

            const stutterCount = 3 + Math.floor(Math.random() * 3);

            // Layer 1: Stuttering square wave bits
            for (let i = 0; i < stutterCount; i++) {
              const stt = t + i * 0.025;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = "square";
              osc.frequency.setValueAtTime(120 + Math.random() * 300, stt);
              gain.gain.setValueAtTime(0.4, stt);
              gain.gain.exponentialRampToValueAtTime(0.001, stt + 0.02);
              osc.connect(gain);
              gain.connect(master);
              osc.start(stt);
              osc.stop(stt + 0.022);
            }

            // Layer 2: Corrupted noise burst (bitcrushed texture)
            const totalDur = stutterCount * 0.025;
            const noiseBuf = createNoiseBuffer(ctx, totalDur + 0.04);
            const bufData = noiseBuf.getChannelData(0);
            for (let i = 0; i < bufData.length; i++) {
              if (Math.random() < 0.15) bufData[i] = Math.sign(bufData[i]);
              if (Math.random() < 0.05) bufData[i] = 0;
            }
            const noiseSrc = ctx.createBufferSource();
            noiseSrc.buffer = noiseBuf;
            const nBand = ctx.createBiquadFilter();
            nBand.type = "bandpass";
            nBand.frequency.setValueAtTime(1200 + Math.random() * 2000, t);
            nBand.Q.setValueAtTime(3, t);
            const nGain = ctx.createGain();
            nGain.gain.setValueAtTime(0.1, t);
            nGain.gain.exponentialRampToValueAtTime(0.001, t + totalDur + 0.03);
            noiseSrc.connect(nBand);
            nBand.connect(nGain);
            nGain.connect(master);
            noiseSrc.start(t);

            // Layer 3: Sub-bass distortion thud
            const sub = ctx.createOscillator();
            const subG = ctx.createGain();
            sub.type = "sawtooth";
            sub.frequency.setValueAtTime(50, t);
            sub.frequency.exponentialRampToValueAtTime(20, t + 0.1);
            subG.gain.setValueAtTime(0.3, t);
            subG.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            sub.connect(subG);
            subG.connect(master);
            sub.start(t);
            sub.stop(t + 0.13);

            // Layer 4: High-frequency interference whine (like a broken CRT)
            const whine = ctx.createOscillator();
            const whineG = ctx.createGain();
            whine.type = "sine";
            whine.frequency.setValueAtTime(6000 + Math.random() * 2000, t);
            whine.frequency.linearRampToValueAtTime(
              200 + Math.random() * 500,
              t + 0.08,
            );
            whineG.gain.setValueAtTime(0.04, t);
            whineG.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            whine.connect(whineG);
            whineG.connect(master);
            whine.start(t);
            whine.stop(t + 0.09);
          } catch (e) {}
        }

        // === HOVER SOUND: Subtle static hum ===
        function playHoverHum() {
          try {
            const ctx = getCtx();
            const t = ctx.currentTime;

            const noise = ctx.createBufferSource();
            noise.buffer = createNoiseBuffer(ctx, 0.06);
            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(2000 + Math.random() * 1000, t);
            filter.Q.setValueAtTime(5, t);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.015, t);
            gain.gain.linearRampToValueAtTime(0.025, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(t);
          } catch (e) {}
        }

        // --- Event listeners ---
        document.addEventListener(
          "click",
          function (e) {
            const el = e.target.closest(
              "button, a, .cursor-pointer, [onclick], select, input",
            );
            if (!el) return;

            const isDanger =
              el.closest(
                ".card-danger-extreme, .card-danger-absolute, .declass-access-danger, .declass-access-void",
              ) ||
              el.textContent?.includes("Eliminar") ||
              el.textContent?.includes("CLASIFICADO");
            if (isDanger) {
              playGlitchClick();
            } else {
              playCRTClick();
            }
          },
          true,
        );

        // Hover sound on interactive cards and buttons (throttled)
        let lastHover = 0;
        document.addEventListener(
          "mouseenter",
          function (e) {
            const now = Date.now();
            if (now - lastHover < 80) return;
            const el = e.target.closest(
              ".group.cursor-pointer, .card-danger-extreme, .card-danger-absolute",
            );
            if (el) {
              lastHover = now;
              playHoverHum();
            }
          },
          true,
        );
      })();
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              registration.update();
              console.log("✅ Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.log("❌ Service Worker registration failed:", error);
            });
        });
      }
    </script>
  </body>
