<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA & SEO Meta Tags -->

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eldritch Dossier" />

      name="twitter:description"
      content="Terminal clasificada de investigación documental sobre criaturas Lovecraftianas y entidades anómalas."

      name="twitter:image"
      content="https://cei-1.github.io/Eldritch-Dossier/icon-512x512.png"

    <!-- Link Canonical (Evita resultados duplicados en Google) -->

      {
        "@context": "https://schema.org",

      }

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Librerías base: React, ReactDOM y Babel para procesar JSX -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- Supabase SDK & Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./supabaseClient.js"></script>

    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                400: "rgb(var(--c-e400) / <alpha-value>)",
                500: "rgb(var(--c-e500) / <alpha-value>)",
                600: "rgb(var(--c-e600) / <alpha-value>)",
                700: "rgb(var(--c-e700) / <alpha-value>)",
                800: "rgb(var(--c-e800) / <alpha-value>)",
                900: "rgb(var(--c-e900) / <alpha-value>)",
                950: "rgb(var(--c-e950) / <alpha-value>)",
              },
            },
          },
        },
      };
    </script>

    <style>
      /* === CSS Custom Properties === */
      :root {
        --c-e400: 52 211 153;
        --c-e500: 16 185 129;
        --c-e600: 5 150 105;
        --c-e700: 4 120 87;
        --c-e800: 6 95 70;
        --c-e900: 6 78 59;
        --c-e950: 2 44 34;
        --scanline-speed: 10s;
        --scanline-opacity: 0.1;
        --crt-line-size: 4px;
      }

      @keyframes flicker {
        0% {
          opacity: 0.05;
        }

        50% {
          opacity: 0.02;
        }

        100% {
          opacity: 0.05;
        }
      }

      @keyframes scanline {
        0% {
          bottom: 100%;
        }

        100% {
          bottom: -100px;
        }
      }

      body {
        background-color: black;
        margin: 0;
        overflow-x: hidden;
        color: rgb(var(--c-e500));
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      :focus-visible {
        outline: 2px solid rgb(var(--c-e400));
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        .crt-overlay,
        .scanline {
          display: none;
        }
      }

      ::-webkit-scrollbar {
        width: 5px;
      }

      ::-webkit-scrollbar-track {
        background: #000;
      }

      ::-webkit-scrollbar-thumb {
        background: rgb(var(--c-e900));
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--c-e500));
      }

      .crt-overlay {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.03),
            rgba(0, 255, 0, 0.01),
            rgba(0, 0, 255, 0.03)
          );
        background-size:
          100% var(--crt-line-size),
          3px 100%;
        transition: all 0.8s;
      }

      .scanline {
        width: 100%;
        height: 100px;
        z-index: 201;
        background: linear-gradient(
          0deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(255, 255, 255, 0.02) 10%,
          rgba(0, 0, 0, 0.1) 100%
        );
        opacity: var(--scanline-opacity);
        position: absolute;
        bottom: 100%;
        animation: scanline var(--scanline-speed) linear infinite;
        transition: opacity 0.8s;
      }

      #root {
        min-height: 100vh;
      }

      option {
        background: #000;
        color: rgb(var(--c-e500));
      }

      input,
      textarea,
      select {
        border-radius: 0 !important;
      }

      .chip-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid rgb(var(--c-e900));
        background: rgb(var(--c-e900) / 0.15);
        font-size: 11px;
        text-transform: uppercase;
        font-weight: 900;
        letter-spacing: 0.05em;
        color: rgb(var(--c-e500));
        cursor: default;
        transition: all 0.2s;
      }

      .chip-tag:hover {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
      }

      .chip-tag .chip-remove {
        cursor: pointer;
        color: rgb(var(--c-e900));
        font-size: 14px;
        line-height: 1;
        transition: color 0.2s;
      }

      .chip-tag:hover .chip-remove {
        color: #ef4444;
      }

      /* === DECLASSIFICATION ANIMATIONS === */
      @keyframes scanReveal {
        0% {
          clip-path: inset(0 0 100% 0);
          filter: brightness(3) saturate(0);
        }

        30% {
          filter: brightness(2) saturate(0.3);
        }

        100% {
          clip-path: inset(0 0 0% 0);
          filter: brightness(1) saturate(1);
        }
      }

      @keyframes fieldReveal {
        0% {
          opacity: 0;
          transform: translateY(12px);
          filter: blur(4px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes stampSlam {
        0% {
          transform: translate(-50%, -50%) scale(5) rotate(-25deg);
          opacity: 0;
        }

        40% {
          transform: translate(-50%, -50%) scale(0.9) rotate(-12deg);
          opacity: 1;
        }

        55% {
          transform: translate(-50%, -50%) scale(1.08) rotate(-12deg);
        }

        100% {
          transform: translate(-50%, -50%) scale(1) rotate(-12deg);
          opacity: 0.55;
        }
      }

      @keyframes accessGlow {
        0%,
        100% {
          box-shadow: 0 0 20px rgb(var(--c-e900) / 0.3);
          border-color: rgb(var(--c-e900));
        }

        50% {
          box-shadow: 0 0 50px rgb(var(--c-e500) / 0.2);
          border-color: rgb(var(--c-e500));
        }
      }

      @keyframes accessGlowDanger {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
          border-color: #7f1d1d;
        }

        50% {
          box-shadow: 0 0 60px rgba(220, 38, 38, 0.4);
          border-color: #dc2626;
        }
      }

      @keyframes accessLine {
        0% {
          width: 0%;
        }

        100% {
          width: 100%;
        }
      }

      @keyframes dangerPulse {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(220, 38, 38, 0);
          border-color: rgba(220, 38, 38, 0.3);
        }

        50% {
          box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
          border-color: rgba(220, 38, 38, 0.7);
        }
      }

      @keyframes absoluteGlitch {
        0%,
        14% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }

        15% {
          clip-path: inset(40% 0 30% 0);
          transform: translate(-3px, 1px);
        }

        16% {
          clip-path: inset(10% 0 60% 0);
          transform: translate(3px, -1px);
        }

        17%,
        41% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }

        42% {
          clip-path: inset(50% 0 20% 0);
          transform: translate(2px, 0);
        }

        43% {
          clip-path: inset(20% 0 50% 0);
          transform: translate(-2px, 1px);
        }

        44%,
        79% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }

        80% {
          clip-path: inset(60% 0 10% 0);
          transform: translate(-4px, 0);
        }

        81%,
        100% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }
      }

      @keyframes absoluteFlicker {
        0%,
        91% {
          opacity: 1;
        }

        92% {
          opacity: 0.3;
        }

        93% {
          opacity: 1;
        }

        95% {
          opacity: 0.5;
        }

        96%,
        100% {
          opacity: 1;
        }
      }

      @keyframes voidGlow {
        0%,
        100% {
          box-shadow:
            0 0 8px rgba(139, 92, 246, 0.2),
            0 0 2px rgba(6, 182, 212, 0.1);
          border-color: rgba(139, 92, 246, 0.4);
        }

        33% {
          box-shadow:
            0 0 25px rgba(139, 92, 246, 0.5),
            0 0 8px rgba(6, 182, 212, 0.3);
          border-color: rgba(6, 182, 212, 0.7);
        }

        66% {
          box-shadow:
            0 0 15px rgba(6, 182, 212, 0.4),
            0 0 30px rgba(139, 92, 246, 0.3);
          border-color: rgba(139, 92, 246, 0.8);
        }
      }

      @keyframes chromaShift {
        0%,
        14%,
        17%,
        41%,
        44%,
        100% {
          text-shadow: none;
        }

        15% {
          text-shadow:
            -2px 0 #06b6d4,
            2px 0 #a855f7;
        }

        16% {
          text-shadow:
            2px 0 #06b6d4,
            -2px 0 #a855f7;
        }

        42% {
          text-shadow:
            -1px 0 #06b6d4,
            1px 0 #a855f7;
        }

        43% {
          text-shadow:
            1px 0 #06b6d4,
            -1px 0 #a855f7;
        }
      }

      @keyframes voidShake {
        0%,
        95% {
          transform: translate(0);
        }

        96% {
          transform: translate(-2px, 1px);
        }

        97% {
          transform: translate(2px, -1px);
        }

        98% {
          transform: translate(-1px, -1px);
        }

        99% {
          transform: translate(1px, 1px);
        }

        100% {
          transform: translate(0);
        }
      }

      @keyframes infoGlitch {
        0%,
        89% {
          transform: translate(0);
          opacity: 1;
        }

        90% {
          transform: translate(-1px, 0);
          opacity: 0.8;
        }

        91% {
          transform: translate(1px, 1px);
          opacity: 1;
        }

        92%,
        100% {
          transform: translate(0);
          opacity: 1;
        }
      }

      @keyframes termType {
        from {
          width: 0;
        }

        to {
          width: 100%;
        }
      }

      .card-danger-extreme {
        animation: dangerPulse 3s ease-in-out infinite;
      }

      .card-danger-absolute {
        animation:
          voidGlow 3s ease-in-out infinite,
          absoluteFlicker 5s step-end infinite;
        position: relative;
      }

      .card-danger-absolute .card-img-wrap {
        animation: absoluteGlitch 4s step-end infinite;
      }

      .card-danger-absolute .card-name-absoluto {
        animation: chromaShift 4s step-end infinite;
        color: #a855f7 !important;
      }

      .card-danger-absolute::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(139, 92, 246, 0.03) 2px,
          rgba(139, 92, 246, 0.03) 4px
        );
        pointer-events: none;
        z-index: 10;
      }

      .modal-absoluto-glitch {
        animation: infoGlitch 6s step-end infinite;
      }

      .modal-absoluto-glitch h2 {
        animation: chromaShift 4s step-end infinite;
      }

      .modal-absoluto-img {
        animation: absoluteGlitch 5s step-end infinite;
      }

      .modal-absoluto-shake {
        animation: voidShake 3s ease-in-out infinite;
      }

      .declass-scan {
        animation: scanReveal 1.4s ease-out both;
      }

      .declass-field {
        opacity: 0;
        animation: fieldReveal 0.5s ease-out both;
      }

      .declass-stamp {
        animation: stampSlam 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
      }

      .declass-access {
        animation: accessGlow 1.2s ease-in-out infinite;
      }

      .declass-access-danger {
        animation: accessGlowDanger 1s ease-in-out infinite;
      }

      .declass-access-void {
        animation: voidGlow 2s ease-in-out infinite;
      }

      .declass-progress {
        animation: accessLine 1.6s ease-in-out both;
      }

      .declass-stamp-fade {
        opacity: 0;
        transition: opacity 0.8s ease-out;
      }

      /* === NYARLATHOTEP CORRUPTION THEME === */
      .theme-corrupted {
        --c-e400: 243 244 246;
        /* gray-100 */
        --c-e500: 229 231 235;
        /* gray-200 (texto principal suave y legible) */
        --c-e600: 156 163 175;
        /* gray-400 */
        --c-e700: 107 114 128;
        /* gray-500 */
        --c-e800: 75 85 99;
        /* gray-600 */
        --c-e900: 55 65 81;
        /* gray-700 */
        --c-e950: 31 41 55;
        /* gray-800 */
      }

      .theme-corrupted .crt-overlay {
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.02),
            rgba(150, 150, 150, 0.02),
            rgba(100, 100, 100, 0.02)
          );
        background-size:
          100% var(--crt-line-size),
          3px 100%;
      }

      .theme-corrupted .scanline {
        background: linear-gradient(
          0deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(150, 150, 150, 0.03) 10%,
          rgba(0, 0, 0, 0.1) 100%
        );
      }

      /* El tema corrupto es estrictamente monocromático. Además de las
       variables esmeralda, neutraliza utilidades de peligro explícitas. */
      .theme-corrupted .app-header h1,
      .theme-corrupted .glitch-text > span,
      .theme-corrupted .card-name-absoluto {
        color: rgb(var(--c-e500)) !important;
        text-shadow: none !important;
      }

      .theme-corrupted [class*="text-red-"],
      .theme-corrupted [class*="text-orange-"],
      .theme-corrupted [class*="text-yellow-"],
      .theme-corrupted [class*="text-green-"],
      .theme-corrupted [class*="text-purple-"],
      .theme-corrupted [class*="text-cyan-"] {
        color: rgb(var(--c-e500)) !important;
      }

      .theme-corrupted [class*="border-red-"],
      .theme-corrupted [class*="border-orange-"],
      .theme-corrupted [class*="border-yellow-"],
      .theme-corrupted [class*="border-green-"],
      .theme-corrupted [class*="border-purple-"],
      .theme-corrupted [class*="border-cyan-"] {
        border-color: rgb(var(--c-e700) / 0.82) !important;
      }

      .theme-corrupted [class*="bg-red-"],
      .theme-corrupted [class*="bg-orange-"],
      .theme-corrupted [class*="bg-yellow-"],
      .theme-corrupted [class*="bg-green-"],
      .theme-corrupted [class*="bg-purple-"],
      .theme-corrupted [class*="bg-cyan-"] {
        background-color: rgb(var(--c-e950) / 0.42) !important;
      }

      .theme-corrupted .card-danger-extreme,
      .theme-corrupted .card-danger-absolute,
      .theme-corrupted .card-danger-absolute .card-img-wrap,
      .theme-corrupted .card-danger-absolute .card-name-absoluto {
        animation: none !important;
        box-shadow: none !important;
      }

      .theme-corrupted .card-danger-absolute::after {
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgb(var(--c-e500) / 0.025) 2px,
          rgb(var(--c-e500) / 0.025) 4px
        );
      }

      .theme-corrupted button:hover {
        border-color: rgb(var(--c-e500)) !important;
        color: #000 !important;
        background-color: rgb(var(--c-e500)) !important;
      }

      .theme-corrupted .mobile-command-bar button:not(.active) {
        color: rgb(var(--c-e800)) !important;
        background: transparent !important;
        border-color: transparent !important;
      }

      .theme-corrupted .mobile-command-bar button.active {
        color: rgb(var(--c-e400)) !important;
        background: rgb(var(--c-e950) / 0.55) !important;
        border-color: rgb(var(--c-e700)) !important;
      }

      /* === R'LYEH ABYSSAL THEME === */
      .theme-rlyeh {
        --c-e400: 34 211 238;
        --c-e500: 6 182 212;
        --c-e600: 8 145 178;
        --c-e700: 14 116 144;
        --c-e800: 21 94 117;
        --c-e900: 22 78 99;
        --c-e950: 8 51 68;
      }

      .theme-rlyeh .crt-overlay {
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%),
          linear-gradient(
            90deg,
            rgba(0, 100, 255, 0.02),
            rgba(0, 200, 255, 0.02),
            rgba(0, 50, 150, 0.02)
          );
        background-size:
          100% var(--crt-line-size),
          3px 100%;
      }

      .theme-rlyeh .scanline {
        background: linear-gradient(
          0deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(6, 182, 212, 0.04) 10%,
          rgba(0, 0, 0, 0.1) 100%
        );
      }

      /* === R'LYEH OVERLAY === */
      @keyframes rlyehWaterRise {
        0% {
          height: 0%;
          opacity: 0;
        }

        20% {
          opacity: 1;
        }

        100% {
          height: 100%;
          opacity: 1;
        }
      }

      @keyframes rlyehBubble {
        0% {
          transform: translateY(0) scale(1);
          opacity: 0.4;
        }

        100% {
          transform: translateY(-100vh) scale(0.2);
          opacity: 0;
        }
      }

      @keyframes rlyehSymbolDrift {
        0%,
        100% {
          opacity: 0;
          transform: translateY(10px) rotate(0deg);
        }

        30%,
        70% {
          opacity: 0.12;
        }

        50% {
          opacity: 0.2;
          transform: translateY(-10px) rotate(5deg);
        }
      }

      @keyframes rlyehGlitch {
        0%,
        88%,
        100% {
          transform: translate(0);
          filter: none;
        }

        90% {
          transform: translate(-3px, 2px);
          filter: hue-rotate(90deg);
        }

        92% {
          transform: translate(3px, -1px);
          filter: hue-rotate(-90deg);
        }

        94% {
          transform: translate(-2px, -2px);
          filter: brightness(2);
        }

        96% {
          transform: translate(2px, 1px);
          filter: hue-rotate(180deg);
        }
      }

      @keyframes rlyehEmerge {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
          filter: blur(8px);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes rlyehDepthPulse {
        0%,
        100% {
          box-shadow: inset 0 0 100px rgba(6, 182, 212, 0.05);
        }

        50% {
          box-shadow: inset 0 0 200px rgba(6, 182, 212, 0.12);
        }
      }

      @keyframes rlyehSonarPing {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.6;
          border-width: 2px;
        }

        100% {
          transform: translate(-50%, -50%) scale(4);
          opacity: 0;
          border-width: 0.5px;
        }
      }

      .rlyeh-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        overflow: hidden;
        animation: rlyehDepthPulse 3s ease-in-out infinite;
      }

      .rlyeh-water {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(
          0deg,
          rgba(6, 182, 212, 0.12) 0%,
          rgba(8, 145, 178, 0.06) 30%,
          rgba(14, 116, 144, 0.02) 60%,
          transparent 100%
        );
        animation: rlyehWaterRise 4s ease-out forwards;
        pointer-events: none;
      }

      .rlyeh-sonar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        width: 100px;
        height: 100px;
        border: 2px solid rgba(6, 182, 212, 0.3);
        border-radius: 50%;
        animation: rlyehSonarPing 2s ease-out infinite backwards;
        pointer-events: none;
      }

      .rlyeh-sonar:nth-child(3) {
        animation-delay: 0.7s;
      }

      .rlyeh-sonar:nth-child(4) {
        animation-delay: 1.4s;
      }

      .rlyeh-symbols {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 100px;
        letter-spacing: 30px;
        color: rgba(6, 182, 212, 0.06);
        animation: rlyehSymbolDrift 5s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
      }

      .rlyeh-msg {
        position: relative;
        z-index: 2;
        text-align: center;
        animation: rlyehGlitch 4s step-end infinite;
      }

      .rlyeh-msg .rlyeh-line {
        animation: rlyehEmerge 1.5s ease-out both;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* Logo tap feedback */
      @keyframes logoTapPulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.03);
        }

        100% {
          transform: scale(1);
        }
      }

      .logo-tap-feedback {
        animation: logoTapPulse 0.15s ease-out;
      }

      .logo-tap-warning {
        animation: logoTapPulse 0.15s ease-out;
        text-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      }

      .logo-tap-critical {
        animation:
          logoTapPulse 0.15s ease-out,
          rlyehGlitch 0.5s step-end;
        text-shadow:
          0 0 25px rgba(6, 182, 212, 0.7),
          -2px 0 rgba(6, 182, 212, 0.3),
          2px 0 rgba(139, 92, 246, 0.3);
      }

      /* === CORRUPTION GLITCH OVERLAY === */
      @keyframes corruptionGlitch {
        0% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }

        2% {
          clip-path: inset(80% 0 0 0);
          transform: translate(-10px, 5px);
        }

        4% {
          clip-path: inset(10% 0 60% 0);
          transform: translate(15px, -3px);
        }

        6% {
          clip-path: inset(40% 0 20% 0);
          transform: translate(-8px, 8px);
        }

        8% {
          clip-path: inset(0 0 80% 0);
          transform: translate(12px, -6px);
        }

        10% {
          clip-path: inset(60% 0 5% 0);
          transform: translate(-15px, 2px);
        }

        12% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }

        14% {
          clip-path: inset(20% 0 30% 0);
          transform: translate(8px, 4px) skewX(5deg);
        }

        16% {
          clip-path: inset(50% 0 10% 0);
          transform: translate(-12px, -8px) skewX(-3deg);
        }

        18% {
          clip-path: inset(5% 0 70% 0);
          transform: translate(6px, 10px);
        }

        20%,
        100% {
          clip-path: inset(0 0 0 0);
          transform: translate(0);
        }
      }

      @keyframes corruptionFlash {
        0%,
        9%,
        12%,
        15%,
        30%,
        33%,
        50%,
        53%,
        70%,
        100% {
          opacity: 0;
        }

        10%,
        11% {
          opacity: 1;
          background: white;
        }

        13%,
        14% {
          opacity: 0.7;
          background: rgb(107, 114, 128);
        }

        31%,
        32% {
          opacity: 0.5;
          background: white;
        }

        51%,
        52% {
          opacity: 0.8;
          background: rgb(55, 65, 81);
        }
      }

      @keyframes corruptionText {
        0% {
          opacity: 0;
          transform: translateY(20px);
          filter: blur(8px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes corruptionScan {
        0% {
          top: -10%;
        }

        100% {
          top: 110%;
        }
      }

      @keyframes corruptionShake {
        0%,
        100% {
          transform: translate(0) rotate(0);
        }

        10% {
          transform: translate(-5px, 3px) rotate(-0.5deg);
        }

        20% {
          transform: translate(4px, -4px) rotate(0.5deg);
        }

        30% {
          transform: translate(-3px, 5px) rotate(-0.3deg);
        }

        40% {
          transform: translate(6px, -2px) rotate(0.4deg);
        }

        50% {
          transform: translate(-4px, 4px) rotate(-0.6deg);
        }

        60% {
          transform: translate(3px, -5px) rotate(0.3deg);
        }

        70% {
          transform: translate(-6px, 2px) rotate(-0.4deg);
        }

        80% {
          transform: translate(5px, 3px) rotate(0.5deg);
        }

        90% {
          transform: translate(-3px, -3px) rotate(-0.2deg);
        }
      }

      .corruption-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: black;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .corruption-glitch-layer {
        position: absolute;
        inset: 0;
        animation: corruptionGlitch 0.8s step-end infinite;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 2px,
          rgba(107, 114, 128, 0.08) 2px,
          rgba(107, 114, 128, 0.08) 4px
        );
      }

      .corruption-flash {
        position: absolute;
        inset: 0;
        animation: corruptionFlash 2s step-end forwards;
        pointer-events: none;
      }

      .corruption-scan-bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: rgba(107, 114, 128, 0.6);
        box-shadow: 0 0 30px rgba(107, 114, 128, 0.4);
        animation: corruptionScan 0.6s linear infinite;
      }

      .corruption-msg {
        position: relative;
        z-index: 2;
        text-align: center;
        animation: corruptionShake 0.3s ease-in-out 10;
        animation-fill-mode: forwards;
      }

      .corruption-msg .msg-line {
        animation: corruptionText 4s ease-out both;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* === AMBIENT AUDIO PROMPT === */
      @keyframes audioPulse {
        0%,
        100% {
          box-shadow:
            0 0 15px rgba(16, 185, 129, 0.15),
            inset 0 0 30px rgba(16, 185, 129, 0.05);
        }

        50% {
          box-shadow:
            0 0 40px rgba(16, 185, 129, 0.3),
            inset 0 0 50px rgba(16, 185, 129, 0.1);
        }
      }

      @keyframes audioWave {
        0% {
          transform: scaleY(0.3);
        }

        25% {
          transform: scaleY(1);
        }

        50% {
          transform: scaleY(0.5);
        }

        75% {
          transform: scaleY(0.8);
        }

        100% {
          transform: scaleY(0.3);
        }
      }

      .audio-prompt-overlay {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(8px);
        animation: fade-in 0.4s ease-out;
      }

      .audio-prompt-box {
        border: 2px solid rgb(var(--c-e500));
        background: #000;
        padding: 2.5rem;
        max-width: 380px;
        width: 90%;
        text-align: center;
        animation: audioPulse 2s ease-in-out infinite;
      }

      .audio-wave-bars {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        height: 32px;
        margin: 1.2rem auto;
      }

      .audio-wave-bars span {
        display: block;
        width: 3px;
        background: rgb(var(--c-e500));
        animation: audioWave 0.8s ease-in-out infinite;
      }

      .audio-wave-bars span:nth-child(1) {
        height: 60%;
        animation-delay: 0s;
      }

      .audio-wave-bars span:nth-child(2) {
        height: 100%;
        animation-delay: 0.1s;
      }

      .audio-wave-bars span:nth-child(3) {
        height: 40%;
        animation-delay: 0.2s;
      }

      .audio-wave-bars span:nth-child(4) {
        height: 80%;
        animation-delay: 0.15s;
      }

      .audio-wave-bars span:nth-child(5) {
        height: 55%;
        animation-delay: 0.25s;
      }

      .audio-wave-bars span:nth-child(6) {
        height: 90%;
        animation-delay: 0.05s;
      }

      .audio-wave-bars span:nth-child(7) {
        height: 45%;
        animation-delay: 0.3s;
      }

      /* Audio toggle button in footer */
      .audio-toggle-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid rgb(var(--c-e900));
        background: transparent;
        color: rgb(var(--c-e900));
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s;
      }

      .audio-toggle-btn:hover {
        border-color: rgb(var(--c-e500));
        color: rgb(var(--c-e500));
      }

      .audio-toggle-btn.active {
        border-color: rgb(var(--c-e500));
        color: rgb(var(--c-e500));
        background: rgb(var(--c-e500) / 0.08);
      }

      .audio-toggle-btn .audio-bars-mini {
        display: flex;
        align-items: flex-end;
        gap: 1px;
        height: 10px;
      }

      .audio-toggle-btn .audio-bars-mini span {
        display: block;
        width: 2px;
        background: currentColor;
        transition: height 0.3s;
      }

      .audio-toggle-btn.active .audio-bars-mini span {
        animation: audioWave 0.8s ease-in-out infinite;
      }

      .audio-toggle-btn.active .audio-bars-mini span:nth-child(1) {
        height: 40%;
        animation-delay: 0s;
      }

      .audio-toggle-btn.active .audio-bars-mini span:nth-child(2) {
        height: 100%;
        animation-delay: 0.1s;
      }

      .audio-toggle-btn.active .audio-bars-mini span:nth-child(3) {
        height: 60%;
        animation-delay: 0.2s;
      }

      .audio-toggle-btn.active .audio-bars-mini span:nth-child(4) {
        height: 80%;
        animation-delay: 0.15s;
      }

      .audio-toggle-btn:not(.active) .audio-bars-mini span {
        height: 2px !important;
        animation: none !important;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      /* === INTERFACE REFINEMENT V7 === */
      body {
        background:
          radial-gradient(
            circle at 50% -20%,
            rgb(var(--c-e950) / 0.35),
            transparent 42rem
          ),
          #010302;
      }

        content: "";

        inset: auto 0 -1px;

      .app-shell {

        padding: 36px 0 120px;
      }

      .featured-dossier {

      .dossier-card {

      .mobile-command-bar {

    <script type="text/babel">
      const { useState, useEffect, useMemo, useCallback, useRef } = React;

      // --- SCRAMBLE TEXT HOOK ---
      function useScrambleText(finalText, active = true, duration = 1500) {
        const [display, setDisplay] = useState("");
        const chars = "!@#$%^&*_+-=|;:<>?/~0123456789ABCDEF";
        useEffect(() => {
          if (!active || !finalText) {
            setDisplay(finalText || "");
            return;
          }
          let frame = 0;
          const totalFrames = Math.max(1, duration / 30);
          const interval = setInterval(() => {
            frame++;
            const progress = frame / totalFrames;
            let result = "";
            for (let i = 0; i < finalText.length; i++) {
              if (finalText[i] === " ") {
                result += " ";
              } else if (i / finalText.length < progress) {
                result += finalText[i];
              } else {
                result += chars[Math.floor(Math.random() * chars.length)];
              }
            }
            setDisplay(result);
            if (frame >= totalFrames) {
              clearInterval(interval);
              setDisplay(finalText);
            }
          }, 30);
          return () => clearInterval(interval);
        }, [finalText, active]);
        return display;
      }

      // --- DECLASSIFY ACCESS OVERLAY ---
      const DeclassifyOverlay = ({ creatureId, dangerLevel, onComplete }) => {
        const isDanger = ["Extremo", "Absoluto"].includes(dangerLevel);
        const isAbsoluto = dangerLevel === "Absoluto";
        const line1Text = isAbsoluto
          ? "CONEXIÓN_FALLIDA"
          : isDanger
            ? "ALERTA_ACCESO_RESTRINGIDO"
            : "ACCEDIENDO_ARCHIVO_CLASIFICADO";
        const line3Text = isAbsoluto
          ? "INTEGRIDAD_SISTEMA_COMPROMETIDA..."
          : isDanger
            ? "VERIFICANDO_NIVEL_AUTORIZACIÓN..."
            : "VERIFICANDO_ACREDITACIÓN...";
        const accessLabel = isAbsoluto
          ? "ANOMALÍA_NIVEL_ABSOLUTO // PELIGRO_EXISTENCIAL"
          : isDanger
            ? `AMENAZA_${dangerLevel?.toUpperCase().replace(" ", "_")} // PROTOCOLO_ROJO`
            : "CIFRADO_ELDRITCH // NIVEL_ACCESO_4";
        const line1 = useScrambleText(line1Text, true, 800);
        const line2 = useScrambleText(
          creatureId || "ED-000000-000",
          true,
          1000,
        );
        const line3 = useScrambleText(line3Text, true, 1200);
        const line4Warn = useScrambleText(
          isAbsoluto
            ? "[ ADVERTENCIA: LECTURA_PUEDE_CAUSAR_DAÑO_COGNITIVO ]"
            : "",
          isAbsoluto,
          1500,
        );

        useEffect(() => {
          // Play Glitch.mp3 for all creatures
          const glitchAudio = new Audio("./assets/audio/Glitch.mp3");
          glitchAudio.volume = 0.5;
          glitchAudio.play().catch(() => {});
          const timer = setTimeout(
            () => onComplete(),
            isAbsoluto ? 2800 : isDanger ? 2200 : 1800,
          );
          return () => clearTimeout(timer);
        }, []);

        const borderCls = isAbsoluto
          ? "border-purple-700 declass-access-void"
          : isDanger
            ? "declass-access-danger border-red-900"
            : "declass-access border-emerald-900";
        const textCls = isAbsoluto
          ? "text-purple-400"
          : isDanger
            ? "text-red-500"
            : "text-emerald-500";
        const subCls = isAbsoluto
          ? "text-purple-800"
          : isDanger
            ? "text-red-800"
            : "text-emerald-800";
        const barBg = isAbsoluto
          ? "bg-purple-950"
          : isDanger
            ? "bg-red-950"
            : "bg-emerald-950";
        const barFg = isAbsoluto
          ? "bg-purple-500"
          : isDanger
            ? "bg-red-500"
            : "bg-emerald-500";
        const labelCls = isAbsoluto
          ? "text-purple-950"
          : isDanger
            ? "text-red-950"
            : "text-emerald-950";

        return (

          >
            <div

            >
              {isAbsoluto
                ? "[ ⚠️ BRECHA_DE_CONTENCIÓN ]"

            </div>
            <div className={`border-2 p-8 max-w-md w-full mx-4 ${borderCls}`}>
              <div
                className={`text-xs font-black uppercase tracking-[0.3em] mb-2 ${textCls}`}
              >
                {line1}
              </div>
              <div
                className={`text-lg font-black uppercase tracking-[0.2em] mb-3 ${isAbsoluto ? "text-purple-300" : "text-white"}`}
              >
                {line2}
              </div>
              <div
                className={`text-[10px] font-black uppercase tracking-[0.2em] mb-4 ${subCls}`}
              >
                {line3}
              </div>
              <div className={`w-full h-1 overflow-hidden ${barBg}`}>
                <div className={`h-full declass-progress ${barFg}`}></div>
              </div>
              <div
                className={`text-[8px] font-black uppercase mt-2 tracking-[0.4em] ${labelCls}`}
              >
                {accessLabel}
              </div>
              {isAbsoluto && (
                <div className="text-[8px] text-purple-500 font-black uppercase mt-4 tracking-[0.2em] animate-pulse text-center">
                  {line4Warn}
                </div>

      };

      // --- ICONOS SVG ---
      const Icon = ({ name, className = "w-4 h-4" }) => {
        const icons = {

          ),
          edit: (
            <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />

          settings: (
            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          ),
          book: (
            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.168.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          ),
          eye: (

          ),
          loader: (
            <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" />
          ),
          download: (
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          ),
          upload: (
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />

          moon: (

          ),
          sun: (

        return (
          <svg

          >
            {icons[name]}
          </svg>

      const escapeRichText = (value = "") =>
        value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      const sanitizeRichText = (value = "") => {
        if (!value) return "";
        if (!/<[a-z][\s\S]*>/i.test(value)) {
          return escapeRichText(value).replace(/\r?\n/g, "<br>");
        }

        const documentFragment = new DOMParser().parseFromString(value, "text/html");
        const allowedTags = new Set([
          "P", "DIV", "BR", "STRONG", "B", "EM", "I", "U", "S", "DEL",
          "UL", "OL", "LI", "BLOCKQUOTE", "A"
        ]);

        const cleanNode = (node) => {
          Array.from(node.children).forEach(cleanNode);
          if (!allowedTags.has(node.tagName)) {
            node.replaceWith(...node.childNodes);
            return;
          }

          Array.from(node.attributes).forEach((attribute) => {
            if (node.tagName !== "A" || attribute.name.toLowerCase() !== "href") {
              node.removeAttribute(attribute.name);
            }
          });

          if (node.tagName === "A") {
            const href = node.getAttribute("href") || "";
            if (!/^(https?:|mailto:)/i.test(href)) {
              node.removeAttribute("href");
            } else {
              node.setAttribute("target", "_blank");
              node.setAttribute("rel", "noopener noreferrer");
            }
          }
        };

        Array.from(documentFragment.body.children).forEach(cleanNode);
        const sanitizedValue = documentFragment.body.innerHTML;
        const visibleText = documentFragment.body.textContent.replace(/[\s\u200B\uFEFF]/g, "");
        return visibleText ? sanitizedValue : "";
      };

      const RichTextEditor = ({ value, onChange, placeholder, labelledBy }) => {
        const editorRef = useRef(null);
        const [activeFormats, setActiveFormats] = useState({});

        useEffect(() => {
          const editor = editorRef.current;
          if (!editor || document.activeElement === editor) return;
          const nextValue = sanitizeRichText(value || "");
          if (editor.innerHTML !== nextValue) editor.innerHTML = nextValue;
        }, [value]);

        const emitChange = () => {
          if (!editorRef.current) return;
          const sanitizedValue = sanitizeRichText(editorRef.current.innerHTML);
          if (!sanitizedValue) editorRef.current.innerHTML = "";
          onChange(sanitizedValue);
        };

        const syncActiveFormats = () => {
          const editor = editorRef.current;
          const selection = window.getSelection();
          if (!editor || !selection?.anchorNode || !editor.contains(selection.anchorNode)) {
            setActiveFormats({});
            return;
          }

          const formatBlock = String(document.queryCommandValue("formatBlock") || "")
            .replace(/[<>]/g, "")
            .toLowerCase();
          setActiveFormats({
            bold: document.queryCommandState("bold"),
            italic: document.queryCommandState("italic"),
            underline: document.queryCommandState("underline"),
            strikeThrough: document.queryCommandState("strikeThrough"),
            insertUnorderedList: document.queryCommandState("insertUnorderedList"),
            insertOrderedList: document.queryCommandState("insertOrderedList"),
            formatBlock: formatBlock === "blockquote",
          });
        };

        const runCommand = (command, commandValue = null) => {
          editorRef.current?.focus();
          document.execCommand(command, false, commandValue);
          emitChange();
          syncActiveFormats();
        };

        const addLink = () => {
          const url = window.prompt("URL del enlace (https://...)");
          if (!url) return;
          if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) {
            window.alert("Utiliza una URL que comience con https://");
            return;
          }
          runCommand("createLink", url);
        };

        const toolbar = [
          ["bold", null, "B", "Negrita"],
          ["italic", null, "I", "Cursiva"],
          ["underline", null, "U", "Subrayado"],
          ["strikeThrough", null, "S", "Tachado"],
          ["insertUnorderedList", null, "• Lista", "Lista con viñetas"],
          ["insertOrderedList", null, "1. Lista", "Lista numerada"],
          ["formatBlock", "blockquote", "❯ Cita", "Cita"],
        ];

        return (
          <div className="rich-text-editor">
            <div className="rich-text-toolbar" role="toolbar" aria-label="Formato de texto">
              {toolbar.map(([command, commandValue, label, title]) => (
                <button
                  key={command}
                  type="button"
                  title={title}
                  aria-label={title}
                  aria-pressed={Boolean(activeFormats[command])}
                  className={activeFormats[command] ? "is-active" : ""}
                  onMouseDown={(event) => event.preventDefault()}
                  onClick={() => runCommand(command, commandValue)}
                >
                  {label}
                </button>
              ))}
              <button
                type="button"
                title="Insertar enlace"
                aria-label="Insertar enlace"
                onMouseDown={(event) => event.preventDefault()}
                onClick={addLink}
              >
                🔗
              </button>
              <button
                type="button"
                title="Quitar formato"
                aria-label="Quitar formato"
                onMouseDown={(event) => event.preventDefault()}
                onClick={() => runCommand("removeFormat")}
              >
                Tx
              </button>
            </div>
            <div
              ref={editorRef}
              className="rich-text-surface"
              contentEditable
              role="textbox"
              aria-multiline="true"
              aria-labelledby={labelledBy}
              data-placeholder={placeholder}
              onFocus={syncActiveFormats}
              onInput={() => {
                emitChange();
                syncActiveFormats();
              }}
              onKeyUp={syncActiveFormats}
              onMouseUp={syncActiveFormats}
              onBlur={() => {
                emitChange();
                setActiveFormats({});
              }}
              onPaste={(event) => {
                event.preventDefault();
                const plainText = event.clipboardData.getData("text/plain");
                document.execCommand("insertText", false, plainText);
              }}
              suppressContentEditableWarning
            />
          </div>
        );
      };

      // --- TOAST COMPONENT ---

      // --- TOAST COMPONENT ---
      const Toast = ({ message, type, onClose }) => {
        useEffect(() => {
          const t = setTimeout(onClose, 3000);
          return () => clearTimeout(t);
        }, []);
        const colors = {
          success: "border-emerald-500 text-emerald-400 bg-emerald-950/40",
          error: "border-red-500 text-red-400 bg-red-950/40",
          info: "border-yellow-500 text-yellow-400 bg-yellow-950/40",
        };
        return (
          <div
            className={`fixed top-6 right-6 z-[400] px-6 py-4 border backdrop-blur-md text-[11px] font-black uppercase tracking-widest animate-in slide-in-from-top-2 duration-300 shadow-2xl ${colors[type] || colors.info}`}
          >
            {message}
          </div>
        );
      };

      // --- COMPONENTES ---
      const DangerBadge = ({ level }) => {
        const colors = {
          Insignificante:
            "text-emerald-700 border-emerald-900 bg-emerald-950/20",
          Inofensivo: "text-emerald-600 border-emerald-900 bg-emerald-950/25",
          Neutral: "text-emerald-500 border-emerald-900 bg-emerald-950/30",
          Bajo: "text-green-400 border-green-900 bg-green-950/30",
          Medio: "text-yellow-400 border-yellow-900 bg-yellow-950/30",
          Alto: "text-orange-500 border-orange-900 bg-orange-950/30",
          "Muy Alto": "text-purple-400 border-purple-900 bg-purple-950/30",
          Extremo: "text-red-500 border-red-900 bg-red-950/30",
          Absoluto:
            "text-purple-400 border-purple-600 bg-purple-950/40 animate-pulse shadow-[0_0_10px_rgba(139,92,246,0.5)]",
        };
        return (
          <span
            className={`px-2 py-0.5 rounded border text-[10px] uppercase font-bold tracking-widest ${colors[level] || "text-gray-400"}`}
          >
            Nivel: {level}
          </span>

      // --- IMAGE ZOOM LIGHTBOX (PC + mobile pinch-zoom) ---
      const ImageZoom = ({ src, onClose }) => {
        const [scale, setScale] = useState(1);
        const [pos, setPos] = useState({ x: 0, y: 0 });
        const containerRef = useRef(null);
        const dragState = useRef({
          active: false,
          startX: 0,
          startY: 0,
          origX: 0,
          origY: 0,
        });
        const pinchState = useRef({
          active: false,
          startDist: 0,
          startScale: 1,
        });

        useEffect(() => {
          const el = containerRef.current;
          if (!el) return;
          const onWheel = (e) => {
            e.preventDefault();
            setScale((s) =>
              Math.min(5, Math.max(0.5, s + (e.deltaY > 0 ? -0.2 : 0.2))),
            );
          };
          el.addEventListener("wheel", onWheel, { passive: false });
          return () => el.removeEventListener("wheel", onWheel);
        }, []);

        const getDist = (t) =>
          Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const getMid = (t) => ({
          x: (t[0].clientX + t[1].clientX) / 2,
          y: (t[0].clientY + t[1].clientY) / 2,
        });

        const startDrag = (clientX, clientY) => {
          dragState.current = {
            active: true,
            startX: clientX,
            startY: clientY,
            origX: pos.x,
            origY: pos.y,
          };
        };
        const moveDrag = (clientX, clientY) => {
          if (!dragState.current.active) return;
          const dx = clientX - dragState.current.startX;
          const dy = clientY - dragState.current.startY;
          setPos({
            x: dragState.current.origX + dx,
            y: dragState.current.origY + dy,
          });
        };
        const endDrag = () => {
          dragState.current.active = false;
          pinchState.current.active = false;
        };

        const handleTouchStart = (e) => {
          if (e.touches.length === 2) {
            e.preventDefault();
            pinchState.current = {
              active: true,
              startDist: getDist(e.touches),
              startScale: scale,
            };
            dragState.current.active = false;
          } else if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        };
        const handleTouchMove = (e) => {
          if (e.touches.length === 2 && pinchState.current.active) {
            e.preventDefault();
            const dist = getDist(e.touches);
            const newScale =
              pinchState.current.startScale *
              (dist / pinchState.current.startDist);
            setScale(Math.min(5, Math.max(0.5, newScale)));
            const mid = getMid(e.touches);
            if (dragState.current.active) moveDrag(mid.x, mid.y);
          } else if (e.touches.length === 1 && !pinchState.current.active) {
            moveDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        };

        return (
          <div
            ref={containerRef}
            className="fixed inset-0 z-[300] bg-black/95 backdrop-blur-md flex items-center justify-center cursor-grab active:cursor-grabbing"
            style={{ touchAction: "none" }}
            onMouseDown={(e) => {
              if (e.button === 0) startDrag(e.clientX, e.clientY);
            }}
            onMouseMove={(e) => moveDrag(e.clientX, e.clientY)}
            onMouseUp={endDrag}
            onMouseLeave={endDrag}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={endDrag}
          >
            <img
              src={src}
              alt="Vista ampliada del expediente"
              className="max-w-[90vw] max-h-[90vh] select-none pointer-events-none"
              style={{
                transform: `translate(${pos.x}px, ${pos.y}px) scale(${scale})`,
                transition:
                  dragState.current.active || pinchState.current.active
                    ? "none"
                    : "transform 0.15s",
              }}
              draggable="false"
            />
            <div className="absolute top-6 right-6 flex gap-3 z-10">
              <button
                onMouseDown={(e) => e.stopPropagation()}
                onClick={() => {
                  setScale(1);
                  setPos({ x: 0, y: 0 });
                }}
                className="p-2 border border-emerald-900 text-emerald-500 hover:bg-emerald-500 hover:text-black transition-all text-xs font-black uppercase tracking-wider"
              >
                1:1
              </button>
              <button
                onMouseDown={(e) => e.stopPropagation()}
                onClick={onClose}

              >
                <Icon name="x" className="w-6 h-6" />
              </button>
            </div>
          </div>
        );
      };

      const atlasRegions = [

      const getAtlasRegion = (creature) => {
        const latitude = Number(creature.ubicacion?.latitud);
        const longitude = Number(creature.ubicacion?.longitud);
        if (
          creature.ubicacion?.latitud !== "" &&
          creature.ubicacion?.longitud !== "" &&
          Number.isFinite(latitude) &&
          Number.isFinite(longitude)
        ) {
          return {
            name: creature.ubicacion?.lugar || creature.ubicacion?.region || creature.ubicacion?.pais || "Ubicación registrada",
            lat: latitude,
            lng: longitude,
            exact: true,
          };
        }
        const cultures = (Array.isArray(creature.origen?.cultura)
          ? creature.origen.cultura
          : creature.origen?.cultura ? [creature.origen.cultura] : [])
          .map((value) => String(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase());
        const cultureRegion = atlasRegions.find((region) =>
          cultures.some((culture) => (region.cultureKeywords || []).some((keyword) => culture.includes(keyword))),
        );
        if (cultureRegion) return cultureRegion;
        const mythologies = (Array.isArray(creature.origen?.mitologia)
          ? creature.origen.mitologia
          : creature.origen?.mitologia ? [creature.origen.mitologia] : [])
          .map((value) => String(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase());
        return atlasRegions.find((region) =>
          mythologies.some((mythology) => region.keywords.some((keyword) => mythology.includes(keyword))),
        ) || atlasRegions[7];
      };

      const CulturalAtlas = ({ creatures, onOpen }) => {
        const mapContainerRef = useRef(null);
        const mapRef = useRef(null);
        const layerRef = useRef(null);

        useEffect(() => {
          if (!mapContainerRef.current || !window.L || mapRef.current) return;
          // La proyección Web Mercator llega hasta ±85.0511°. Horizontalmente el mundo se repite.
          const atlasBounds = window.L.latLngBounds([[-85.0511, -1000000], [85.0511, 1000000]]);
          const map = window.L.map(mapContainerRef.current, {
            scrollWheelZoom: false,
            minZoom: 2,
            maxZoom: 8,
            maxBounds: atlasBounds,
            maxBoundsViscosity: 1,
            worldCopyJump: true,
          }).setView([21, -15], 2);
          window.L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19,
            noWrap: false,
          }).addTo(map);
          const resetControl = window.L.control({ position: "topleft" });
          resetControl.onAdd = () => {
            const button = window.L.DomUtil.create("button", "atlas-reset-control");
            button.type = "button";
            button.title = "Recentrar atlas";
            button.setAttribute("aria-label", "Recentrar atlas");
            button.textContent = "⌖";
            window.L.DomEvent.on(button, "click", (event) => {
              window.L.DomEvent.stop(event);
              map.setView([21, -15], 2);
            });
            return button;
          };
          resetControl.addTo(map);
          mapRef.current = map;
          layerRef.current = window.L.layerGroup().addTo(map);
          requestAnimationFrame(() => map.invalidateSize());
          return () => {
            map.remove();
            mapRef.current = null;
          };
        }, []);

        useEffect(() => {
          const map = mapRef.current;
          const layer = layerRef.current;
          if (!map || !layer || !window.L) return;
          layer.clearLayers();
          const visibleRegions = new Map();

          creatures.forEach((creature) => {
            const region = getAtlasRegion(creature);
            if (!region.exact) visibleRegions.set(region.name, region);
          });
          visibleRegions.forEach((region) => {
            window.L.circle([region.lat, region.lng], {
              radius: 650000,
              color: "#10b981",
              weight: 1,
              fillColor: "#065f46",
              fillOpacity: 0.14,
              interactive: false,
            }).bindTooltip(region.name, { direction: "top", opacity: 0.85 }).addTo(layer);
          });

          const offsets = {};
          creatures.forEach((creature) => {
            const region = getAtlasRegion(creature);
            const locationKey = region.exact
              ? `${region.lat.toFixed(6)},${region.lng.toFixed(6)}`
              : region.name;
            const index = offsets[locationKey] || 0;
            offsets[locationKey] = index + 1;
            const angle = index * 2.4;
            const distance = index === 0 ? 0 : 0.7 + Math.floor((index - 1) / 6) * 0.45;
            const lat = region.lat + Math.sin(angle) * distance;
            const lng = region.lng + Math.cos(angle) * distance;
            const extreme = ["Extremo", "Absoluto"].includes(creature.nivel_peligro);
            const marker = window.L.circleMarker([lat, lng], {
              radius: extreme ? 9 : 7,
              color: extreme ? "#ef4444" : "#34d399",
              weight: 2,
              fillColor: extreme ? "#7f1d1d" : "#064e3b",
              fillOpacity: 0.95,
            }).addTo(layer);
            const popup = document.createElement("div");
            popup.className = "font-mono min-w-[170px]";
            const title = document.createElement("div");
            title.className = "text-[11px] font-black uppercase leading-tight";
            title.textContent = creature.nombre;
            const meta = document.createElement("div");
            meta.className = "text-[8px] mt-2 text-emerald-700 uppercase tracking-widest";
            meta.textContent = `${region.name} // ${creature.nivel_peligro || "SIN NIVEL"}`;
            const button = document.createElement("button");
            button.className = "mt-3 w-full border border-emerald-700 py-2 text-[8px] font-black uppercase text-emerald-400 hover:bg-emerald-500 hover:text-black";
            button.textContent = "Abrir expediente";
            button.onclick = () => onOpen(creature);
            popup.append(title, meta, button);
            marker.bindPopup(popup);
          });
        }, [creatures, onOpen]);

        if (!window.L) {
          return <div className="atlas-map flex items-center justify-center text-[10px] uppercase tracking-widest text-emerald-700">Cargando cartografía...</div>;
        }
        return <div ref={mapContainerRef} className="atlas-map" aria-label="Mapa interactivo de procedencia cultural" />;
      };

      // --- APP PRINCIPAL ---

      // Bloquea el documento detrás de pantallas de carga y expedientes.
      // position: fixed evita el desplazamiento elástico de Safari en iOS.
      useEffect(() => {
        const shouldLockScroll =
          loading ||
          selectedCreature !== null ||
          corruptionActive ||
          rlyehActive;

        if (!shouldLockScroll) return;

        const scrollY = window.scrollY;
        const previous = {
          overflow: document.body.style.overflow,
          position: document.body.style.position,
          top: document.body.style.top,
          width: document.body.style.width,
          overscroll: document.documentElement.style.overscrollBehavior,
        };

        document.body.style.overflow = "hidden";
        document.body.style.position = "fixed";
        document.body.style.top = `-${scrollY}px`;
        document.body.style.width = "100%";
        document.documentElement.style.overscrollBehavior = "none";

        return () => {
          document.body.style.overflow = previous.overflow;
          document.body.style.position = previous.position;
          document.body.style.top = previous.top;
          document.body.style.width = previous.width;
          document.documentElement.style.overscrollBehavior = previous.overscroll;
          window.scrollTo(0, scrollY);
        };
      }, [
        loading,
        selectedCreature !== null,
        corruptionActive,
        rlyehActive,
      ]);

      useEffect(() => {
        const goOnline = () => {

            showToast(
              "Modo sin conexión: los cambios están deshabilitados",
              "error",

          };
          window.addEventListener("online", goOnline);
          window.addEventListener("offline", goOffline);
          return () => {
            window.removeEventListener("online", goOnline);
            window.removeEventListener("offline", goOffline);
          };
        }, []);

        // --- SUPABASE AUTH STATE LISTENER ---
        useEffect(() => {
          const {
            data: { subscription },
          } = window._supabase.auth.onAuthStateChange(
            async (event, session) => {
              if (event === "SIGNED_OUT") {
                setCurrentUser(null);
                setUserRole(null);

                // El usuario ha sido redirigido de vuelta con el token de recuperación en la URL
                setShowUpdateKeyModal(true);

            },
          );
          return () => subscription.unsubscribe();

        // --- AMBIENT AUDIO SYSTEM ---
        // Initializes <audio> element once and manages user preference via localStorage.
        // On first visit: show a themed prompt. On subsequent visits: auto-play on first interaction.
        useEffect(() => {
          if (!ambientAudioRef.current) {
            const audio = new Audio("./assets/audio/VHS.mp3");
            audio.loop = false;
            audio.volume = 0.15;

            // Seamless loop via crossfade: start a clone before the track ends
            const CROSSFADE_TIME = 2; // seconds before end to start fading
            let crossfading = false;

            audio.addEventListener("timeupdate", () => {
              if (
                !crossfading &&
                audio.duration &&
                audio.currentTime > audio.duration - CROSSFADE_TIME
              ) {
                crossfading = true;
                // Create a clone that starts from 0
                const clone = audio.cloneNode();
                clone.volume = 0;
                clone.play().catch(() => {});

                // Fade out current, fade in clone
                const fadeSteps = 20;
                const fadeInterval = (CROSSFADE_TIME * 1000) / fadeSteps;
                let step = 0;
                const targetVol = audio.volume;
                const fader = setInterval(() => {
                  step++;
                  const progress = step / fadeSteps;
                  clone.volume = targetVol * progress;
                  audio.volume = targetVol * (1 - progress);
                  if (step >= fadeSteps) {
                    clearInterval(fader);
                    audio.pause();
                    audio.currentTime = 0;
                    audio.volume = targetVol;
                    // Swap: clone becomes the main audio
                    ambientAudioRef.current = clone;
                    crossfading = false;
                    // Attach the same crossfade logic to clone
                    let cloneCrossfading = false;
                    clone.addEventListener(
                      "timeupdate",
                      function cloneHandler() {
                        if (
                          !cloneCrossfading &&
                          clone.duration &&
                          clone.currentTime > clone.duration - CROSSFADE_TIME
                        ) {
                          cloneCrossfading = true;
                          clone.removeEventListener("timeupdate", cloneHandler);
                          // Restart original
                          audio.currentTime = 0;
                          audio.volume = 0;
                          audio.play().catch(() => {});
                          let s2 = 0;
                          const f2 = setInterval(() => {
                            s2++;
                            const p2 = s2 / fadeSteps;
                            audio.volume = targetVol * p2;
                            clone.volume = targetVol * (1 - p2);
                            if (s2 >= fadeSteps) {
                              clearInterval(f2);
                              clone.pause();
                              clone.currentTime = 0;
                              clone.volume = targetVol;
                              ambientAudioRef.current = audio;
                              crossfading = false;
                            }
                          }, fadeInterval);
                        }
                      },
                    );
                  }
                }, fadeInterval);
              }
            });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 16;

            const richTextBlocks = (value) => {

              const textWithBreaks = (node) => {
                if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || "";
                if (node.nodeName === "BR") return "\n";
                return Array.from(node.childNodes).map(textWithBreaks).join("");
              };
              const blocks = [];
              Array.from(documentFragment.body.childNodes).forEach((node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                  textWithBreaks(node).split(/\n+/).forEach((text) => {
                    if (text.trim()) blocks.push({ text: text.trim() });
                  });
                  return;
                }
                if (node.nodeName === "UL" || node.nodeName === "OL") {
                  Array.from(node.children).forEach((item, index) => {
                    const text = textWithBreaks(item).trim();
                    if (text) blocks.push({ text, prefix: node.nodeName === "OL" ? `${index + 1}. ` : "• " });
                  });
                  return;
                }
                const text = textWithBreaks(node).trim();
                if (text) blocks.push({ text, prefix: node.nodeName === "BLOCKQUOTE" ? "> " : "" });
              });

                  return {

                (dangerOrder[b.nivel_peligro] || 0) -

            return 0;
          });
          return result;
        }, [creatures, search, filterMito, filterDanger, filterAbility, sortBy]);

        const currentItems = filtered.slice(

          const next =
            dir === "next"

          setDeclassPhase(0);
          setSelectedCreature(next);

        const openAtlasCreature = useCallback((creature) => {
          setDeclassPhase(0);
          setSelectedCreature(creature);

        const handleSwipeStart = (e) => {
          const t = e.touches[0];
          swipeRef.current = { startX: t.clientX, startY: t.clientY };
        };
        const handleSwipeEnd = (e) => {
          const t = e.changedTouches[0];
          const dx = t.clientX - swipeRef.current.startX;
          const dy = t.clientY - swipeRef.current.startY;
          if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx < 0) navigateCreature("next");
            else navigateCreature("prev");
          }

        // --- EASTER EGG: CORRUPTION OVERLAY ---
        const CorruptionOverlay = () => {
          const audioRef = useRef(null);

          useEffect(() => {
            const audio = new Audio("./assets/audio/Interferencia.mp3");
            audio.volume = 0.7;
            audioRef.current = audio;

            const handleEnded = () => {
              setCorruptionActive(false);
              // Deactivate R'lyeh theme if active, corruption takes over
              if (themeRlyeh) {
                setThemeRlyeh(false);
                localStorage.removeItem("eldritch_rlyeh");

              // Open Nyarlathotep
              const nyar = creatures.find(

              if (nyar) {
                setDeclassPhase(0);
                setSelectedCreature(nyar);
              }
            };

            audio.addEventListener("ended", handleEnded);
            audio.play().catch(() => {
              // If autoplay blocked, fallback to timeout
              setTimeout(handleEnded, 5000);

            return () => {
              audio.removeEventListener("ended", handleEnded);

                  style={{ animationDelay: "2.5s", animationDuration: "2.5s" }}

              </div>

        // --- EASTER EGG: R'LYEH OVERLAY ---
        const RlyehOverlay = () => {
          const audioRef = useRef(null);

          useEffect(() => {
            // Play Tormenta.mp3
            const audio = new Audio("./assets/audio/Tormenta.mp3");
            audio.volume = 0.7;
            audioRef.current = audio;

            const MIN_DISPLAY_MS = 8000; // Minimum time to keep overlay visible for reading
            const startTime = Date.now();
            let dismissed = false;

            const handleDismiss = () => {
              if (dismissed) return;
              dismissed = true;
              setRlyehActive(false);
              setThemeRlyeh(true);
              localStorage.setItem("eldritch_rlyeh", new Date().toDateString());
              // Open Cthulhu if exists
              const cthulhu = creatures.find(
                (c) => c.nombre && c.nombre.toLowerCase().includes("cthulhu"),
              );
              if (cthulhu) {
                setDeclassPhase(0);
                setSelectedCreature(cthulhu);
              }
            };

            const handleEnded = () => {
              // If audio ends before minimum display time, wait the remainder
              const elapsed = Date.now() - startTime;
              const remaining = MIN_DISPLAY_MS - elapsed;
              if (remaining > 0) {
                setTimeout(handleDismiss, remaining);
              } else {
                handleDismiss();
              }
            };

            audio.addEventListener("ended", handleEnded);
            audio.play().catch(() => {
              // If autoplay blocked, fallback to minimum display timeout
              setTimeout(handleDismiss, MIN_DISPLAY_MS);
            });

            // Safety fallback: always dismiss after max time
            const safetyTimer = setTimeout(handleDismiss, 12000);

            return () => {
              clearTimeout(safetyTimer);
              audio.removeEventListener("ended", handleEnded);
              audio.pause();
              audio.currentTime = 0;
            };
          }, []);

          return (

              <div className="rlyeh-sonar"></div>
              <div className="rlyeh-sonar"></div>

                <div
                  className="rlyeh-line text-[9px] text-cyan-700 font-black uppercase tracking-[0.4em] mb-8"

                  className="rlyeh-line text-xl md:text-3xl font-black uppercase italic text-cyan-400 mb-4"
                  style={{ animationDelay: "2s" }}

                  R'lyeh wgah'nagl fhtagn"

                <div

            {view === "explorer" ? (
              <main className="app-shell relative z-10 mx-auto animate-in fade-in duration-500">

                  return (

                        setDeclassPhase(0);
                        setSelectedCreature(c);
                      }}

                <div className="control-deck mb-10 uppercase font-bold text-[10px] space-y-3">
                  {/* Row 1: Search + count + refresh */}

                    <div className="relative flex-1 group">

                      <input

                    <button

                      value={filterAbility}

                    >

                      {allAbilities.map((ability) => (

                    <select
                      className="bg-black border border-emerald-900/30 py-2 px-2 md:px-3 text-[9px] md:text-[10px] text-emerald-500 outline-none uppercase font-bold cursor-pointer hover:border-emerald-500 transition-colors min-w-0 truncate"

                        const mitos = toArr(creature.origen?.mitologia).map(
