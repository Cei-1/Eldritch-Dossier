<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperación de Acceso - Eldritch Dossier</title>
</head>
<body style="background-color: #000000; margin: 0; padding: 0;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #000000; color: #00FF00; font-family: 'Courier New', Courier, monospace; padding: 20px;">
    <tr>
      <td align="center">
        <!-- Main Container -->
        <table width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="border: 1px solid #00FF00; max-width: 600px; margin: 0 auto; background-color: #000000;">
          <tr>
            <td style="padding: 30px;">

              <!-- Mensaje Principal -->
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="font-size: 16px; line-height: 1.6; color: #00FF00; text-align: left; padding-bottom: 30px;">
                    [ SISTEMA : AVISO ]<br><br>
                    Protocolo de actualizaci&oacute;n de credencial iniciado. Para confirmar la nueva llave de acceso al Eldritch Dossier, acceda al siguiente enlace cifrado.
                  </td>
                </tr>
              </table>

              <!-- Botón de Confirmación -->
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" style="padding-bottom: 40px;">
                    <!-- Nota: El {{ .ConfirmationURL }} sirve también en Supabase para inyectar el enlace de recuperación de contraseñas -->
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #000000; color: #00FF00; font-family: 'Courier New', Courier, monospace; font-size: 18px; font-weight: bold; text-decoration: none; border: 2px solid #00FF00; padding: 12px 24px; letter-spacing: 1px; text-transform: uppercase;">
                      &gt; RENOVAR_LLAVE
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Pie de página / Advertencia -->
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="font-size: 12px; line-height: 1.4; color: #00aa00; text-align: left; border-top: 1px dashed #00FF00; padding-top: 15px;">
                    NOTA: Si usted no solicit&oacute; esto, ignore este mensaje.
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
